              <button key={i} onClick={()=>setSampleEditIdx(i)} style={BT({
                padding:"5px 12px",fontSize:11,fontWeight:sampleEditIdx===i?900:600,
                borderColor:sampleEditIdx===i?T.cyan:(sl.hasBuf?T.accent:T.border),
                color:sampleEditIdx===i?T.cyan:(sl.hasBuf?T.accent:T.dim),
                background:sampleEditIdx===i?T.panel2:"transparent",
              })}>{slotLetter(i)}{sl.hasBuf?" ●":" ○"}</button>
            ))}
            <span style={{fontSize:8,color:T.dim,marginLeft:6,fontStyle:"italic"}}>each slot holds its own sample, trim, pitch + envelope · pick the slot per step in the step editor</span>
          </div>
          <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
            {/* SOURCE */}
            <div style={{minWidth:190,flex:"1 1 210px"}}>
              <div style={{fontSize:9,color:T.cyan,letterSpacing:2,marginBottom:6}}>SOURCE · SLOT {slotLetter(sampleEditIdx)}</div>
              <div style={{display:"flex",gap:4,marginBottom:6,flexWrap:"wrap"}}>
                <button onClick={()=>pickSampleFile(sampleEditIdx)} style={BT({padding:"4px 10px",fontSize:10,borderColor:T.accent,color:T.accent})}>IMPORT</button>
                {!recHere
                  ?<button onClick={()=>startSampleRecording(sampleEditIdx)} disabled={sampleRecording} style={BT({padding:"4px 10px",fontSize:10,borderColor:sampleRecording?T.border:T.coral,color:sampleRecording?T.dim:T.coral,opacity:sampleRecording?0.5:1})}>● REC</button>
                  :<button onClick={stopSampleRecording} style={BT({padding:"4px 10px",fontSize:10,borderColor:T.warn,color:"#fff",background:T.warn})}>■ STOP</button>}
                <button onClick={()=>previewSample(sampleEditIdx)} disabled={!es.hasBuf} style={BT({padding:"4px 12px",fontSize:10,borderColor:es.hasBuf?T.gold:T.border,color:es.hasBuf?T.gold:T.dim,opacity:es.hasBuf?1:0.5,cursor:es.hasBuf?"pointer":"default"})}>▶</button>
                {es.hasBuf&&<button onClick={()=>clearSample(sampleEditIdx)} style={BT({padding:"4px 8px",fontSize:10,borderColor:T.border,color:T.dim})}>✕</button>}
              </div>
              <div style={{fontSize:9,color:recHere?T.coral:T.dim,marginBottom:10,minHeight:12,fontStyle:"italic"}}>
                {sampleBusy?"…decoding":recHere?"recording — tap STOP":es.hasBuf?("loaded · "+(es.name||"sample")):"import a file or record via mic"}
              </div>
              <div style={{display:"flex",gap:4,marginBottom:10,flexWrap:"wrap"}}>
                <button onClick={()=>updateSampleSlot(sampleEditIdx,"track",!es.track)} style={BT({flex:1,padding:"5px 6px",fontSize:9,borderColor:es.track?T.cyan:T.border,color:es.track?T.cyan:T.dim,background:es.track?T.panel2:"transparent"})}>{es.track?"PITCH TRACK":"FIXED PITCH"}</button>
                <button onClick={()=>updateSampleSlot(sampleEditIdx,"loop",!es.loop)} style={BT({flex:1,padding:"5px 6px",fontSize:9,borderColor:es.loop?T.purple:T.border,color:es.loop?T.purple:T.dim,background:es.loop?T.panel2:"transparent"})}>{es.loop?"LOOP ON":"LOOP OFF"}</button>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                <span style={{fontSize:9,color:T.dim}}>Level</span>
                <span style={{fontSize:9,color:T.cyan}}>{Math.round(es.level*100)}%</span>
              </div>
              <input type="range" min={0} max={1.5} step={.01} value={es.level} onChange={e=>updateSampleSlot(sampleEditIdx,"level",+e.target.value)} style={{width:"100%",accentColor:T.cyan,marginBottom:10}}/>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                <span style={{fontSize:9,color:T.dim}}>Dist</span>
                <span style={{fontSize:9,color:es.dist>0?T.coral:T.dim}}>{Math.round((es.dist||0)*100)}%</span>
              </div>
              <input type="range" min={0} max={1} step={.01} value={es.dist||0} onChange={e=>updateSampleSlot(sampleEditIdx,"dist",+e.target.value)} style={{width:"100%",accentColor:T.coral}}/>
            </div>
            {/* TRIM */}
            <div style={{minWidth:150,flex:"1 1 170px"}}>
              <div style={{fontSize:9,color:T.accent,letterSpacing:2,marginBottom:6}}>TRIM</div>
              <canvas ref={sampleWaveCanvasRef} width={280} height={48} style={{width:"100%",height:48,background:T.panel2,border:"1px solid "+T.border,borderRadius:2,marginBottom:8,display:"block"}}/>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                <span style={{fontSize:9,color:T.dim}}>Start</span><span style={{fontSize:10,color:T.accent}}>{Math.round(es.trimStart*100)}%</span>
              </div>
              <input type="range" min={0} max={0.99} step={.005} value={es.trimStart} onChange={e=>updateSampleSlot(sampleEditIdx,"trimStart",clamp(Math.min(+e.target.value,es.trimEnd-0.01),0,0.99))} style={{width:"100%",marginBottom:8,accentColor:T.accent}}/>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                <span style={{fontSize:9,color:T.dim}}>End</span><span style={{fontSize:10,color:T.accent}}>{Math.round(es.trimEnd*100)}%</span>
              </div>
              <input type="range" min={0.01} max={1} step={.005} value={es.trimEnd} onChange={e=>updateSampleSlot(sampleEditIdx,"trimEnd",clamp(Math.max(+e.target.value,es.trimStart+0.01),0.01,1))} style={{width:"100%",marginBottom:8,accentColor:T.accent}}/>
              <button onClick={()=>{updateSampleSlot(sampleEditIdx,"trimStart",0);updateSampleSlot(sampleEditIdx,"trimEnd",1);}} style={BT({width:"100%",padding:"3px 4px",fontSize:9,borderColor:T.border,color:T.dim})}>FULL</button>
            </div>
            {/* PITCH */}
            <div style={{minWidth:150,flex:"1 1 160px"}}>
              <div style={{fontSize:9,color:T.gold,letterSpacing:2,marginBottom:6}}>PITCH</div>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                <span style={{fontSize:9,color:T.dim}}>Coarse</span><span style={{fontSize:10,color:T.gold}}>{(es.coarse>0?"+":"")+es.coarse} st</span>
              </div>
              <input type="range" min={-24} max={24} step={1} value={es.coarse} onChange={e=>updateSampleSlot(sampleEditIdx,"coarse",+e.target.value)} style={{width:"100%",marginBottom:8,accentColor:T.gold}}/>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                <span style={{fontSize:9,color:T.dim}}>Fine</span><span style={{fontSize:10,color:T.gold}}>{(es.fine>0?"+":"")+es.fine} ct</span>
              </div>
              <input type="range" min={-100} max={100} step={1} value={es.fine} onChange={e=>updateSampleSlot(sampleEditIdx,"fine",+e.target.value)} style={{width:"100%",marginBottom:8,accentColor:T.gold}}/>
              <div style={{display:"flex",gap:4}}>
                <button onClick={()=>updateSampleSlot(sampleEditIdx,"coarse",clamp(es.coarse-12,-24,24))} style={BT({flex:1,padding:"3px 4px",fontSize:9,borderColor:T.border,color:T.dim})}>-OCT</button>
                <button onClick={()=>{updateSampleSlot(sampleEditIdx,"coarse",0);updateSampleSlot(sampleEditIdx,"fine",0);}} style={BT({flex:1,padding:"3px 4px",fontSize:9,borderColor:T.border,color:T.dim})}>RESET</button>
                <button onClick={()=>updateSampleSlot(sampleEditIdx,"coarse",clamp(es.coarse+12,-24,24))} style={BT({flex:1,padding:"3px 4px",fontSize:9,borderColor:T.border,color:T.dim})}>+OCT</button>
              </div>
            </div>
            {/* ENVELOPE */}
            <div style={{minWidth:160,flex:"1 1 180px"}}>
              <div style={{fontSize:9,color:T.purple,letterSpacing:2,marginBottom:6}}>ENVELOPE</div>
              {[["A","attack",.001,.5,T.gold],["D","decay",.005,1,T.coral],["S","sustain",0,1,"#44aaff"],["R","release",.005,3,T.purple]].map(([lbl,key,mn,mx,c])=>(
                <div key={lbl} style={{display:"flex",alignItems:"center",gap:5,marginBottom:5}}>
                  <span style={{fontSize:10,color:c,width:10,fontWeight:700}}>{lbl}</span>
                  <input type="range" min={mn} max={mx} step={.001} value={es[key]} onChange={e=>updateSampleSlot(sampleEditIdx,key,+e.target.value)} style={{flex:1,accentColor:c}}/>
                  <span style={{fontSize:9,color:T.dim,width:42,textAlign:"right"}}>{lbl==="S"?Math.round(es[key]*100)+"%":(es[key]*1000|0)+"ms"}</span>
                </div>
              ))}
              <div style={{fontSize:8,color:T.dim,marginTop:8,lineHeight:1.5}}>Runs through the synth filter / distortion / delay / reverb chain. Each step selects a slot (Off/A–{slotLetter(SAMPLE_SLOT_COUNT-1)}); SLIDE steps glide the sample pitch in realtime.</div>
            </div>
          </div>
        </div>
      )}
      <input ref={sampleFileInputRef} type="file" accept="audio/*" onChange={onSampleFileChosen} style={{display:"none"}}/>
      </div>
      );
    })()}

    {/* ══ SUB BASS VOICE ════════════════════════════════ */}
    <div style={{background:T.panel,border:"1px solid "+(showSub?(subOn?T.gold:T.border):T.border),borderRadius:4,padding:"10px 14px",marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:showSub?12:0}}>
        <div onClick={()=>setShowSub(s=>!s)} style={{cursor:"pointer",flex:1,display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:10,color:subOn?T.gold:T.dim,letterSpacing:3}}>SUB BASS VOICE</span>
          <span style={{fontSize:9,color:T.dim}}>{subWave==="triangle"?"TRI":subWave==="sawtooth"?"SAW":subWave.toUpperCase()} · oct {subOctave>0?"+":""}{subOctave} · {subMode.toUpperCase()}</span>
          <span style={{fontSize:11,color:T.dim,marginLeft:4}}>{showSub?"▲":"▼"}</span>
        </div>
        <button onClick={e=>{e.stopPropagation();setSubOn(v=>!v);}} style={BT({
          padding:"4px 12px",fontSize:10,fontWeight:900,
          borderColor:subOn?T.gold:T.border,
          color:subOn?T.gold:T.dim,
          background:subOn?T.panel2:"transparent",
          marginLeft:8,
        })}>{subOn?"◉ ON":"○ OFF"}</button>
      </div>
      {showSub&&(
        <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
          {/* Mode + waveform */}
          <div style={{minWidth:180,flex:"1 1 180px"}}>
            <div style={{fontSize:9,color:T.gold,letterSpacing:2,marginBottom:6}}>TRIG MODE</div>
            <div style={{display:"flex",gap:4,marginBottom:10,flexWrap:"wrap"}}>
              {[["step","STEP"],["euclid","EUCLID"],["matrix","MATRIX"],["tm","TM GATE"]].map(([id,lbl])=>(
                <button key={id} onClick={()=>setSubMode(id)} style={BT({
                  padding:"4px 8px",fontSize:10,
                  borderColor:subMode===id?T.gold:T.border,
                  color:subMode===id?T.gold:T.dim,
                  background:subMode===id?T.panel2:"transparent",
                })}>{lbl}</button>
              ))}
            </div>
            {subMode==="euclid"&&(
              <div style={{marginBottom:8,display:"flex",gap:6}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                    <span style={{fontSize:9,color:T.dim}}>Euclid Pulses</span>
                    <span style={{fontSize:9,color:T.gold}}>{subEuclidPulses}</span>
                  </div>
                  <input type="range" min={1} max={64} step={1} value={subEuclidPulses}
                    onChange={e=>setSubEuclidPulses(+e.target.value)} style={{width:"100%",accentColor:T.gold}}/>
                </div>
                <div style={{flex:1}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                    <span style={{fontSize:9,color:T.dim}}>Euclid Rot</span>
                    <span style={{fontSize:9,color:T.gold}}>{subEuclidRotate}</span>
                  </div>
                  <input type="range" min={0} max={64} step={1} value={subEuclidRotate}
                    onChange={e=>setSubEuclidRotate(+e.target.value)} style={{width:"100%",accentColor:T.gold}}/>
                </div>
              </div>
            )}
            <div style={{fontSize:9,color:T.gold,letterSpacing:2,marginBottom:6}}>WAVEFORM</div>
            <div style={{display:"flex",gap:3,marginBottom:6,flexWrap:"wrap"}}>
              {["sine","triangle","square","sawtooth"].map(w=>(
                <button key={w} onClick={()=>setSubWave(w)} style={BT({
                  padding:"4px 7px",fontSize:9,
                  borderColor:subWave===w?T.gold:T.border,
                  color:subWave===w?T.gold:T.dim,
                  background:subWave===w?T.panel2:"transparent",
                })}>{w==="triangle"?"TRI":w==="sawtooth"?"SAW":w.toUpperCase()}</button>
              ))}
            </div>
            <div style={{fontSize:8,color:T.dim,lineHeight:1.4}}>
              Key + scale can be locked per Loop Cycle slot; STEP mode uses per-step SUB toggles.
            </div>
          </div>
          {/* Pitch + envelope */}
          <div style={{minWidth:150,flex:"1 1 150px"}}>
            <div style={{fontSize:9,color:T.gold,letterSpacing:2,marginBottom:6}}>PITCH / GATE</div>
            {[
              ["Octave",subOctave,setSubOctave,-2,1,1,v=>(v>0?"+":"")+v],
              ["Gate",subGate,setSubGate,0.15,1.2,.01,v=>Math.round(v*100)+"%"],
              ["Glide",subGlide,setSubGlide,0,0.2,.002,v=>Math.round(v*1000)+"ms"],
            ].map(([lbl,val,set,mn,mx,step,fmt])=>(
              <div key={lbl} style={{marginBottom:5}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                  <span style={{fontSize:9,color:T.dim}}>{lbl}</span>
                  <span style={{fontSize:9,color:T.gold}}>{fmt(val)}</span>
                </div>
                <input type="range" min={mn} max={mx} step={step} value={val}
                  onChange={e=>set(+e.target.value)} style={{width:"100%",accentColor:T.gold}}/>
              </div>
            ))}
            <div style={{display:"flex",gap:6,marginBottom:6}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                  <span style={{fontSize:9,color:T.dim}}>Decay</span>
                  <span style={{fontSize:9,color:T.gold}}>{Math.round(subDecay*1000)}ms</span>
                </div>
                <input type="range" min={.03} max={.7} step={.005} value={subDecay}
                  onChange={e=>setSubDecay(+e.target.value)} style={{width:"100%",accentColor:T.gold}}/>
              </div>
              <div style={{flex:1}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                  <span style={{fontSize:9,color:T.dim}}>Release</span>
                  <span style={{fontSize:9,color:T.gold}}>{Math.round(subRelease*1000)}ms</span>
                </div>
                <input type="range" min={.03} max={1.2} step={.005} value={subRelease}
                  onChange={e=>setSubRelease(+e.target.value)} style={{width:"100%",accentColor:T.gold}}/>
              </div>
            </div>
          </div>
          {/* Sound shaping */}
          <div style={{minWidth:150,flex:"1 1 150px"}}>
            <div style={{fontSize:9,color:T.gold,letterSpacing:2,marginBottom:6}}>SOUND</div>
            {[
              ["Level",subLevel,setSubLevel,0,1,.01,v=>Math.round(v*100)+"%"],
              ["LPF",subCut,setSubCut,0,1,.01,v=>Math.round(subFilterHz(v))+"Hz"],
              ["Drive",subDrive,setSubDrive,0,1,.01,v=>v===0?"off":Math.round(v*100)+"%"],
            ].map(([lbl,val,set,mn,mx,step,fmt])=>(
              <div key={lbl} style={{marginBottom:5}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                  <span style={{fontSize:9,color:T.dim}}>{lbl}</span>
                  <span style={{fontSize:9,color:T.gold}}>{fmt(val)}</span>
                </div>
                <input type="range" min={mn} max={mx} step={step} value={val}
                  onChange={e=>set(+e.target.value)} style={{width:"100%",accentColor:T.gold}}/>
              </div>
            ))}
          </div>
          {/* X Sub Sequencer */}
          <div style={{minWidth:180,flex:"1 1 180px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <div style={{fontSize:9,color:T.gold,letterSpacing:2}}>X SUB SEQUENCER</div>
              <button onClick={()=>setSubXOpen(v=>!v)} style={BT({
                padding:"2px 8px",fontSize:9,fontWeight:900,
                borderColor:(subXOpen||subXOn)?T.gold:T.border,
                color:(subXOpen||subXOn)?T.gold:T.dim,
                background:(subXOpen||subXOn)?T.panel2:"transparent",
              })}>{subXOpen?"OPEN":"X"}</button>
            </div>
            {subXOpen&&(
              <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
                  <button onClick={()=>setSubXOn(v=>!v)} style={BT({
                    padding:"2px 8px",fontSize:9,
                    borderColor:subXOn?T.gold:T.border,
                    color:subXOn?T.gold:T.dim,
                    background:subXOn?T.panel2:"transparent",
                  })}>{subXOn?"◉ ON":"○ OFF"}</button>
                  <div style={{display:"flex",gap:3,alignItems:"center"}}>
                    <span style={{fontSize:9,color:T.dim}}>STEPS</span>
                    {[2,3,5].map(n=>(
                      <button key={n} onClick={()=>setSubXLen(n)} style={BT({
                        padding:"2px 7px",fontSize:9,
                        borderColor:subXLen===n?T.gold:T.border,
                        color:subXLen===n?T.gold:T.dim,
                        background:subXLen===n?T.panel2:"transparent",
                      })}>{n}</button>
                    ))}
                  </div>
                  <label style={{display:"flex",gap:6,alignItems:"center",fontSize:9,color:T.dim,cursor:"pointer"}}>
                    <input type="checkbox" checked={subXReset} onChange={e=>setSubXReset(e.target.checked)} style={{accentColor:T.gold}}/>
                    reset
                  </label>
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {subXSeq.slice(0,subXLen).map((xs,xi)=>(
                    <div key={xi} style={{
                      flex:"1 1 56px",minWidth:56,
                      border:"1px solid "+(subXOn&&xi===subXStepDisp?T.gold:(xs.on?T.gold+"88":T.border)),
                      borderRadius:3,padding:"5px 5px",
                      background:subXOn&&xi===subXStepDisp?T.gold+"22":(xs.on?T.panel:T.stepOff),
                      boxShadow:subXOn&&xi===subXStepDisp?"0 0 12px "+T.gold+"66":"none",
                    }}>
                      <div style={{fontSize:8,color:(subXOn&&xi===subXStepDisp)?T.gold:T.dim,textAlign:"center",marginBottom:3}}>X{xi+1}</div>
                      <button onClick={()=>setSubXSeq(prev=>prev.map((s,j)=>j===xi?{...s,on:!s.on}:s))} style={BT({
                        width:"100%",padding:"2px 0",fontSize:9,
                        borderColor:xs.on?T.gold:T.border,
                        color:xs.on?T.gold:T.dim,
                        background:xs.on?T.panel2:"transparent",
                        marginBottom:3,
                      })}>{xs.on?"ON":"OFF"}</button>
                      <div style={{display:"flex",gap:2,marginBottom:3}}>
                        {[['root','R'],['third','3'],['fifth','5']].map(([id,lbl])=>(
                          <button key={id} onClick={()=>setSubXSeq(prev=>prev.map((s,j)=>j===xi?{...s,tone:id}:s))} style={BT({
                            flex:1,padding:"2px 0",fontSize:9,
                            borderColor:xs.tone===id?T.gold:T.border,
                            color:xs.tone===id?T.gold:T.dim,
                            background:xs.tone===id?T.panel2:"transparent",
                          })}>{lbl}</button>
                        ))}
                      </div>
                      <div style={{display:"flex",gap:2}}>
                        {[-1,0,1].map(o=>(
                          <button key={o} onClick={()=>setSubXSeq(prev=>prev.map((s,j)=>j===xi?{...s,oct:o}:s))} style={BT({
                            flex:1,padding:"2px 0",fontSize:9,
                            borderColor:xs.oct===o?T.gold:T.border,
                            color:xs.oct===o?T.gold:T.dim,
                            background:xs.oct===o?T.panel2:"transparent",
                          })}>{o>0?"+"+o:o}</button>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </div>

      {/* ══ DOT MATRIX ═══════════════════════════════════ */}
      <div style={{background:T.panel,border:"1px solid "+T.border,borderRadius:4,padding:"10px 14px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6,marginBottom:8}}>
          <div style={{fontSize:10,color:T.coral,letterSpacing:3}}>DOT MATRIX</div>
          <div style={{fontSize:8,color:T.dim}}>Each matrix has its own run mode, step length (1-16), and reset rule.</div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(250px,1fr))",gap:8}}>
          {DOT_MATRIX_TARGETS.map(row=>{
            const id=row.id;
            const cfg=sanitizeDotMatrixConfig(dotMatrixCfg[id]);
            const grid=sanitizeDotGrid(dotMatrices[id]);
            const activeCell=dotMatrixActiveCells[id];
            return(
              <div key={id} style={{background:T.panel2,border:"1px solid "+T.border,borderRadius:3,padding:"8px 9px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <div style={{fontSize:9,color:row.color,letterSpacing:2}}>{row.label} MATRIX</div>
                  <div style={{display:"flex",gap:5,alignItems:"center"}}>
                    <button onClick={()=>setDotMatrices(prev=>{
                      const base=sanitizeDotGrid((prev||{})[id]);
                      for(let r=0;r<4;r++)for(let c=0;c<4;c++)base[r][c]=Math.random()<0.35;
                      return {...(prev||{}),[id]:base};
                    })} style={BT({
                      padding:"1px 6px",fontSize:8,
                      borderColor:T.border,color:T.dim,background:"transparent",
                    })}>RND</button>
                    <button onClick={()=>setDotMatrixCfg(prev=>({
                      ...prev,
                      [id]:{...sanitizeDotMatrixConfig(prev[id]),follow:!cfg.follow}
                    }))} style={BT({
                      padding:"2px 6px",fontSize:8,
                      borderColor:cfg.follow?row.color:T.border,
                      color:cfg.follow?row.color:T.dim,
                      background:cfg.follow?T.panel:"transparent",
                    })}>{cfg.follow?"FOLLOW":"FREE"}</button>
                    <button onClick={()=>setDotMatrixCfg(prev=>({
                      ...prev,
                      [id]:{...sanitizeDotMatrixConfig(prev[id]),reset:!cfg.reset}
                    }))} style={BT({
                      padding:"2px 6px",fontSize:8,
                      borderColor:cfg.reset?row.color:T.border,
                      color:cfg.reset?row.color:T.dim,
                      background:cfg.reset?T.panel:"transparent",
                    })}>{cfg.reset?"RESET":"NO RESET"}</button>
                  </div>
                </div>
                <div style={{display:"flex",gap:3,flexWrap:"wrap",marginBottom:6}}>
                  {DOT_MATRIX_MODES.map(mode=>(
                    <button key={mode} onClick={()=>setDotMatrixCfg(prev=>({
                      ...prev,
                      [id]:{...sanitizeDotMatrixConfig(prev[id]),mode}
                    }))} style={BT({
                      padding:"2px 6px",fontSize:8,textTransform:"uppercase",
                      borderColor:cfg.mode===mode?row.color:T.border,
                      color:cfg.mode===mode?row.color:T.dim,
                      background:cfg.mode===mode?T.panel:"transparent",
                    })}>{mode}</button>
                  ))}
                </div>
                <div style={{marginBottom:4}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                    <span style={{fontSize:8,color:T.dim}}>steps</span>
                    <span style={{fontSize:8,color:row.color}}>{cfg.len}</span>
                  </div>
                  <input type="range" min={1} max={16} step={1} value={cfg.len}
                    onChange={e=>setDotMatrixCfg(prev=>({
                      ...prev,
                      [id]:{...sanitizeDotMatrixConfig(prev[id]),len:clamp(+e.target.value,1,16)}
                    }))}
                    style={{width:"100%",accentColor:row.color}}/>
                </div>
                <div style={{marginBottom:6}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                    <span style={{fontSize:8,color:T.dim}}>depth</span>
                    <span style={{fontSize:8,color:row.color}}>{cfg.amt===0?"off":Math.round(cfg.amt*100)+"%"}</span>
                  </div>
                  <input type="range" min={0} max={1} step={0.01} value={cfg.amt}
                    onChange={e=>setDotMatrixCfg(prev=>({
                      ...prev,
                      [id]:{...sanitizeDotMatrixConfig(prev[id]),amt:+e.target.value}
                    }))}
                    style={{width:"100%",accentColor:row.color}}/>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:3}}>
                  {Array.from({length:16},(_,i)=>{
                    const r=Math.floor(i/4),c=i%4;
                    const on=!!(grid[r]&&grid[r][c]);
                    const isActive=activeCell===i;
                    return <button key={id+"-"+i} onClick={()=>setDotMatrices(prev=>{
                      const base=sanitizeDotGrid((prev||{})[id]);
                      const next={...(prev||{})};
                      base[r][c]=!base[r][c];
                      next[id]=base;
                      return next;
                    })} style={BT({
                      width:"100%",height:24,padding:0,fontSize:10,
                      borderColor:isActive?row.color:on?row.color+"aa":T.border,
                      color:isActive?"#fff":on?row.color:T.dim,
                      background:isActive?row.color+(on?"":"44"):on?T.panel:"transparent",
                      boxShadow:isActive?"0 0 10px "+row.color+(on?"cc":"66"):on?"0 0 6px "+row.color+"44":"none",
                      transition:"background .08s,box-shadow .08s",
                    })}>{on?"●":"○"}</button>;
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>

    {/* ══ TURING MACHINE ════════════════════════════════ */}
    <div style={{background:T.panel,border:"1px solid "+(showTM?(tmOn?T.cyan:T.border):T.border),borderRadius:4,padding:"10px 14px",marginBottom:10}}>
      <div onClick={()=>setShowTM(s=>!s)} style={{cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:showTM?10:0}}>
        <div style={{fontSize:10,color:T.dim,letterSpacing:3}}>
          TURING MACHINE <span style={{fontSize:9,color:tmOn?T.cyan:T.dim,marginLeft:8}}>{tmOn?"◉ EVOLVING":"○ OFF"}</span>
        </div>
        <span style={{fontSize:11,color:T.dim}}>{showTM?"▲":"▼"}</span>
      </div>
      {showTM&&(
        <div>
          <div style={{display:"grid",gridTemplateColumns:"minmax(260px,360px) 1fr",gap:10,alignItems:"stretch"}}>
            <div style={{background:T.panel2,border:"1px solid "+T.border,borderRadius:3,padding:"8px 9px",height:"100%"}}>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
                <button onClick={()=>setTmOn(v=>!v)} style={BT({
                  padding:"7px 12px",fontWeight:900,fontSize:11,
                  background:tmOn?"#001a12":"transparent",
                  borderColor:tmOn?T.cyan:T.border,color:tmOn?T.cyan:T.dim,
                })}>{tmOn?"◉ EVOLVE":"○ STATIC"}</button>
                <button onClick={()=>setTmLocked(v=>!v)} style={BT({
                  padding:"7px 10px",fontSize:11,
                  borderColor:tmLocked?T.cyan:T.border,color:tmLocked?T.cyan:T.dim,
                  background:tmLocked?T.panel2:"transparent",
                })}>{tmLocked?"⊘ LOCK":"◎ LOCK"}</button>
                <button onClick={()=>{
                  const len=clamp(Math.round(tmLength),3,TM_MAX_STEPS);
                  tmBoolRegRef.current=tmMakeBoolReg(len);
                  tmFloatRegRef.current=tmMakeFloatReg(len);
                  setTmRegDisp([...tmBoolRegRef.current]);
                  setTmFloatDisp([...tmFloatRegRef.current]);
                }} style={BT({padding:"7px 10px",fontSize:11})}>⚡ REROLL</button>
              </div>

              <div style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                  <span style={{fontSize:9,color:T.dim,letterSpacing:2}}>MUTATION PROB</span>
                  <span style={{fontSize:9,color:T.cyan}}>{Math.round(tmProb*100)}%</span>
                </div>
                <input type="range" min={0} max={.5} step={.005} value={tmProb}
                  onChange={e=>setTmProb(+e.target.value)} style={{width:"100%",accentColor:T.cyan}}/>
              </div>

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontSize:9,color:T.dim,letterSpacing:2}}>LOOP SIZE</span>
                <div style={{display:"flex",gap:3,flexWrap:"wrap",justifyContent:"flex-end"}}>
                  {TM_LENGTH_OPTIONS.map(n=>(
                    <button key={n} onClick={()=>setTmLength(n)} style={BT({
                      padding:"4px 7px",fontSize:11,
                      borderColor:tmLength===n?T.cyan:T.border,color:tmLength===n?T.cyan:T.dim,
                      background:tmLength===n?T.panel2:"transparent",
                    })}>{n}</button>
                  ))}
                </div>
              </div>

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontSize:9,color:T.dim,letterSpacing:2}}>RATE</span>
                <div style={{display:"flex",gap:3}}>
                  {TM_RATE_OPTIONS.map(r=>{
                    const lbl=r===0.5?"1/2x":r===2?"2x":"1x";
                    return <button key={r} onClick={()=>setTmRate(r)} style={BT({
                      padding:"4px 8px",fontSize:10,
                      borderColor:tmRate===r?T.cyan:T.border,
                      color:tmRate===r?T.cyan:T.dim,
                      background:tmRate===r?T.panel2:"transparent",
                    })}>{lbl}</button>;
                  })}
                </div>
              </div>

              <div style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                  <span style={{fontSize:9,color:T.dim,letterSpacing:2}}>STEP OFFSET</span>
                  <span style={{fontSize:9,color:T.cyan}}>{tmOffset>=0?`+${tmOffset}`:tmOffset}</span>
                </div>
                <input type="range" min={-31} max={31} step={1} value={tmOffset}
                  onChange={e=>setTmOffset(Math.round(+e.target.value))} style={{width:"100%",accentColor:T.cyan}}/>
              </div>

              <div>
                <div style={{fontSize:9,color:T.dim,letterSpacing:2,marginBottom:4}}>ROUTES</div>
                <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                  {[["gate","GATE",T.cyan],["filter","FILTER","#44bbff"],["octave","OCTAVE",T.accent],["decay","DECAY",T.gold]].map(([key,lbl,c])=>(
                    <button key={key} onClick={()=>setTmRoutes(r=>({...r,[key]:!r[key]}))} style={BT({
                      padding:"5px 10px",fontSize:10,
                      borderColor:tmRoutes[key]?c:T.border,color:tmRoutes[key]?c:T.dim,
                      background:tmRoutes[key]?T.panel2:"transparent",
                    })}>{lbl}</button>
                  ))}
                </div>
                <div style={{marginTop:7,display:"grid",gridTemplateColumns:"repeat(2,minmax(120px,1fr))",gap:6}}>
                  {[['gate','GATE',T.cyan],['filter','FILTER','#44bbff'],['octave','OCTAVE',T.accent],['decay','DECAY',T.gold]].map(([key,lbl,c])=>(
                    <div key={key}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                        <span style={{fontSize:8,color:T.dim}}>{lbl} DEPTH</span>
                        <span style={{fontSize:8,color:c}}>{Math.round((tmDepth[key]??0.35)*100)}%</span>
                      </div>
                      <input type="range" min={0} max={1} step={0.01} value={tmDepth[key]??0.35}
                        onChange={e=>setTmDepth(d=>({...d,[key]:+e.target.value}))}
                        style={{width:"100%",accentColor:c}}/>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div style={{background:T.panel2,border:"1px solid "+T.border,borderRadius:3,padding:"8px 9px",height:"100%"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{fontSize:9,color:T.dim,letterSpacing:2}}>REGISTER VIEW</span>
                <span style={{fontSize:9,color:T.cyan}}>
                  {tmLength} steps · {tmStepDisp>=0?`active ${tmStepDisp+1}`:"active --"}
                </span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:`repeat(${tmLength}, minmax(16px,1fr))`,gap:3}}>
                {tmRegDisp.slice(0,tmLength).map((b,i)=>{
                  const isActiveTm=tmOn&&i===tmStepDisp;
                  const fv=clamp(tmFloatDisp[i]||0,0,1);
                  return(
                    <div key={i} style={{display:"flex",flexDirection:"column",gap:2,alignItems:"stretch"}}>
                      <div style={{fontSize:8,color:isActiveTm?T.cyan:T.dim,textAlign:"center",fontWeight:isActiveTm?900:400}}>{i+1}</div>
                      <div style={{
                        height:30,border:"1px solid "+(isActiveTm?T.cyan:T.border),borderRadius:2,position:"relative",background:T.stepOff,
                        boxShadow:isActiveTm?"0 0 8px "+T.cyan+"66":"none",
                      }}>
                        <div style={{
                          position:"absolute",left:1,right:1,bottom:1,
                          height:Math.max(2,Math.round(fv*26)),
                          background:isActiveTm?T.cyan:T.accent,borderRadius:1,
                          boxShadow:isActiveTm?"0 0 8px "+T.cyan+"aa":"0 0 5px "+T.accent+"88",
                        }}/>
                      </div>
                      <div onClick={()=>{
                        tmBoolRegRef.current[i]=!tmBoolRegRef.current[i];
                        setTmRegDisp([...tmBoolRegRef.current]);
                      }} style={{
                        height:9,borderRadius:2,cursor:"pointer",
                        border:"1px solid "+(b?T.cyan:T.border),
                        background:b?T.cyan+"aa":T.stepOff,
                        boxShadow:b?"0 0 6px "+T.cyan:"none",
                      }}/>
                    </div>
                  );
                })}
              </div>
              <div style={{fontSize:8,color:T.dim,marginTop:6,lineHeight:1.35}}>
                Bottom pads toggle gate register bits. Vertical bars show continuous modulation lane.
              </div>
            </div>
          </div>
        </div>
      )}
    </div>

    {/* Settings modal */}
    {showSettings&&false&&(/* no-op — voice panel IS settings now */null)}

    <div style={{fontSize:9,color:T.dim,letterSpacing:2,marginTop:4,textAlign:"center",opacity:.4}}>
      SkurkyMello · Space/S = play/stop · click step column = set pitch · right-click = skip
    </div>
    </div>{/* end body padding */}
  </div>
  );
}

class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return {error};}
  componentDidCatch(error,info){try{console.error("[skurkymello]",error,info);}catch(e){}}
  render(){
    if(!this.state.error)return this.props.children;
    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,background:"linear-gradient(180deg,#04120b 0%,#01060a 100%)",color:"#cfeedd",fontFamily:"'Courier New',monospace",padding:24,textAlign:"center"}}>
        <div style={{fontSize:22,letterSpacing:4,fontWeight:900,color:"#e3fff0"}}>Skurky<span style={{color:"#00dd88"}}>Mello</span></div>
        <div style={{fontSize:12,letterSpacing:1,color:"#ff7755",maxWidth:520,lineHeight:1.5}}>Something went wrong and the interface stopped rendering.</div>
        <div style={{fontSize:10,color:"#4d9966",maxWidth:520,whiteSpace:"pre-wrap",lineHeight:1.4,opacity:.85}}>{String((this.state.error&&this.state.error.message)||this.state.error)}</div>
        <button onClick={()=>{try{location.reload();}catch(e){}}} style={{marginTop:8,padding:"8px 18px",background:"#061810",color:"#99ffcc",border:"1px solid #00dd88",borderRadius:4,fontFamily:"'Courier New',monospace",fontSize:12,letterSpacing:2,cursor:"pointer"}}>RELOAD</button>
        <div style={{fontSize:9,color:"#2a5c3a",letterSpacing:1,marginTop:4}}>Saved patches and slots live in this browser and are unaffected.</div>
      </div>
    );
  }
}

const __bootStart=performance.now();
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><SkurkyMello/></ErrorBoundary>);
function __hideBootScreen(){
  const boot=document.getElementById("boot-screen");
  document.body.classList.add("app-ready");
  if(!boot)return;
  boot.classList.add("hidden");
  setTimeout(()=>{if(boot&&boot.parentNode)boot.parentNode.removeChild(boot);},440);
}
setTimeout(__hideBootScreen,Math.max(0,480-(performance.now()-__bootStart)));
</script>
