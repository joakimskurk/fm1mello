      if(Number.isFinite(d.distLevel))setDistLevel(clamp(d.distLevel,0.2,1.4));
      if(Number.isFinite(d.masterVol))setMasterVol(clamp(d.masterVol,0,1));

      if(typeof d.subOscOn==="boolean")setSubOscOn(d.subOscOn);
      if(Number.isFinite(d.subOscLevel))setSubOscLevel(clamp(d.subOscLevel,0,1));
      if(Number.isFinite(d.subOscOct))setSubOscOct(clamp(Math.round(d.subOscOct),-2,0));
      if(typeof d.subOscWave==="string")setSubOscWave(d.subOscWave);

      if(Number.isFinite(d.attack))setAttack(clamp(d.attack,0.001,0.5));
      if(Number.isFinite(d.decay))setDecay(clamp(d.decay,0.005,1));
      if(Number.isFinite(d.sustain))setSustain(clamp(d.sustain,0,1));
      if(Number.isFinite(d.release))setRelease(clamp(d.release,0.005,2));
      if(typeof d.oscType==="string")setOscType(d.oscType);
      if(Number.isFinite(d.pwmWidth))setPwmWidth(clamp(d.pwmWidth,0.05,0.95));
      if(typeof d.lfoOn==="boolean")setLfoOn(d.lfoOn);
      if(Number.isFinite(d.lfoRate))setLfoRate(clamp(d.lfoRate,LFO_RATE_MIN,LFO_RATE_MAX));
      if(Number.isFinite(d.lfoDepth))setLfoDepth(clamp(d.lfoDepth,0,1));
      if(typeof d.lfoTarget==="string")setLfoTarget(d.lfoTarget);
      if(Number.isFinite(d.filterCut))setFilterCut(clamp(d.filterCut,0,1));
      if(Number.isFinite(d.filterRes))setFilterRes(clamp(d.filterRes,0,1));
      if(Number.isFinite(d.slideTime))setSlideTime(clamp(d.slideTime,0,0.3));

      if(Array.isArray(d.sampleSlots)){
        setSampleSlots(()=>Array.from({length:SAMPLE_SLOT_COUNT},(_,i)=>{
          const base=makeSampleSlot();
          const src=d.sampleSlots[i]||{};
          const m={...base,...src};
          m.coarse=clamp(Math.round(m.coarse||0),-24,24);
          m.fine=clamp(Math.round(m.fine||0),-100,100);
          m.level=clamp(Number.isFinite(m.level)?m.level:0.7,0,1.5);
          m.attack=clamp(Number.isFinite(m.attack)?m.attack:0.005,0.001,2);
          m.decay=clamp(Number.isFinite(m.decay)?m.decay:0.12,0.005,2);
          m.sustain=clamp(Number.isFinite(m.sustain)?m.sustain:0.7,0,1);
          m.release=clamp(Number.isFinite(m.release)?m.release:0.15,0.005,3);
          m.trimStart=clamp(Number.isFinite(m.trimStart)?m.trimStart:0,0,0.999);
          m.trimEnd=clamp(Number.isFinite(m.trimEnd)?m.trimEnd:1,m.trimStart+0.001,1);
          m.track=!!m.track; m.loop=!!m.loop;
          m.hasBuf=!!sampleBuffersRef.current[i];
          m.name=(sampleSlotsRef.current[i]&&sampleSlotsRef.current[i].name)||m.name||"";
          return m;
        }));
      }else if(d.sampleOn!==undefined||d.sampleCoarse!==undefined){
        // Backward compat: migrate an old single-sample snapshot into slot A.
        setSampleSlots(prev=>prev.map((sl,i)=>i!==0?sl:{...sl,
          coarse:clamp(Math.round(d.sampleCoarse||0),-24,24),
          fine:clamp(Math.round(d.sampleFine||0),-100,100),
          track:typeof d.sampleTrack==="boolean"?d.sampleTrack:sl.track,
          loop:typeof d.sampleLoop==="boolean"?d.sampleLoop:sl.loop,
          level:Number.isFinite(d.sampleLevel)?clamp(d.sampleLevel,0,1.5):sl.level,
          attack:Number.isFinite(d.sampleAttack)?clamp(d.sampleAttack,0.001,2):sl.attack,
          decay:Number.isFinite(d.sampleDecay)?clamp(d.sampleDecay,0.005,2):sl.decay,
          sustain:Number.isFinite(d.sampleSustain)?clamp(d.sampleSustain,0,1):sl.sustain,
          release:Number.isFinite(d.sampleRelease)?clamp(d.sampleRelease,0.005,3):sl.release,
        }));
      }
      if(typeof d.sampleSeq==="boolean")setSampleSeq(d.sampleSeq);
      if(typeof d.sampleOn==="boolean")setSampleOn(d.sampleOn);

      if(typeof d.tmOn==="boolean")setTmOn(d.tmOn);
      if(Number.isFinite(d.tmProb))setTmProb(clamp(d.tmProb,0,0.5));
      if(Number.isFinite(d.tmLength))setTmLength(clamp(Math.round(d.tmLength),3,TM_MAX_STEPS));
      if(Number.isFinite(d.tmRate))setTmRate(clamp(Number(d.tmRate),0.5,2));
      if(Number.isFinite(d.tmOffset))setTmOffset(clamp(Math.round(d.tmOffset),-TM_MAX_STEPS,TM_MAX_STEPS));
      if(typeof d.tmLocked==="boolean")setTmLocked(d.tmLocked);
      if(d.tmRoutes&&typeof d.tmRoutes==="object")setTmRoutes({
        gate:!!d.tmRoutes.gate,
        filter:!!d.tmRoutes.filter,
        octave:!!(d.tmRoutes.octave||d.tmRoutes.pitch),
        decay:!!d.tmRoutes.decay,
      });
      if(d.tmDepth&&typeof d.tmDepth==="object")setTmDepth({
        gate:clamp(Number(d.tmDepth.gate??0.35),0,1),
        filter:clamp(Number(d.tmDepth.filter??0.35),0,1),
        octave:clamp(Number(d.tmDepth.octave??0.35),0,1),
        decay:clamp(Number(d.tmDepth.decay??0.35),0,1),
      });
      if(Array.isArray(d.tmBoolReg)){
        tmBoolRegRef.current=tmEnsureLength(d.tmBoolReg.slice(0,TM_MAX_STEPS).map(v=>!!v),TM_MAX_STEPS,false);
        setTmRegDisp([...tmBoolRegRef.current]);
      }
      if(d.randMask&&typeof d.randMask==="object")setRandMask({
        pitch:!!d.randMask.pitch,pulses:!!d.randMask.pulses,ratchet:!!d.randMask.ratchet,gate:!!d.randMask.gate,octave:!!d.randMask.octave,
        accent:!!d.randMask.accent,sub:!!d.randMask.sub,slide:!!d.randMask.slide,skip:!!d.randMask.skip,prob:!!d.randMask.prob,samp:!!d.randMask.samp,
      });
    }catch(e){}
  }

  function buildSnap(){
    return {
      steps,seqLen,pitchSpanOct,bpm,clockDiv,
      midiNoteOutOn,midiLeadCh,midiSubCh,midiLenMode,midiFixedLenMs,
      rootNote,scaleName,globalOct,
      segCount,segSplits,segRepeats,segDirection,segMode,segSkip,masterLen,
      planLen,planSteps,planActive,planSync,
      subOn,subMode,subEuclidPulses,subEuclidRotate,subLevel,subOctave,
      subWave,subGate,subDecay,subRelease,subGlide,subCut,subDrive,
      subXOn,subXOpen,subXSeq,subXLen,subXReset,
      dotMatrices,dotMatrixCfg,
      reverbWet,reverbSize,reverbType,reverbDecay,reverbPre,reverbTone,reverbLevel,
      delayWet,delaySync,delayDiv,delayTime,delayFb,delayTone,delayLevel,
      distAmt,distMix,distCharacter,distTone,distLevel,masterVol,
      subOscOn,subOscLevel,subOscOct,subOscWave,
      attack,decay,sustain,release,
      oscType,pwmWidth,lfoOn,lfoRate,lfoDepth,lfoTarget,
      filterCut,filterRes,slideTime,
      sampleOn,sampleSeq,sampleSlots,
      tmOn,tmProb,tmLength,tmRate,tmOffset,tmLocked,tmRoutes,tmDepth,
      tmBoolReg:tmBoolRegRef.current.slice(),
      randMask,
    };
  }

  const SLOT_IGNORED_EFFECT_KEYS=[
    "reverbWet","reverbSize","reverbType","reverbDecay","reverbPre","reverbTone","reverbLevel",
    "delayWet","delaySync","delayDiv","delayTime","delayFb","delayTone","delayLevel",
    "distAmt","distMix","distCharacter","distTone","distLevel",
  ];
  function stripEffectFieldsFromSnap(snap){
    const next={...(snap||{})};
    SLOT_IGNORED_EFFECT_KEYS.forEach(k=>{delete next[k];});
    return next;
  }

  function saveToSlot(idx){
    try{
      const next=Array.from({length:MAX_SLOT_COUNT},(_,i)=>slots[i]||null);
      next[idx]=stripEffectFieldsFromSnap(buildSnap());
      setSlots(next);
      setActiveSlot(idx);
      localStorage.setItem(SLOTS_KEY,JSON.stringify(next));
    }catch(e){}
  }

  // Loop-cycle (planetary) seq config preserved across slot-seq-driven slot loads,
  // so the LOOP CYCLE SEQ keeps running independently of the slot sequencer.
  const SLOT_LOOPCYCLE_KEYS=["planActive","planSteps","planLen","planSync"];
  function applySlotSnap(snap,idx,fromSlotSeq){
    if(!snap)return;
    try{
      let toApply=stripEffectFieldsFromSnap(snap);
      // BPM is GLOBAL — never overwritten by loading a slot, so external sync
      // (BroadcastChannel / MIDI clock) stays locked when switching slots.
      delete toApply.bpm;
      if(fromSlotSeq){
        toApply={...toApply};
        SLOT_LOOPCYCLE_KEYS.forEach(k=>{delete toApply[k];});
      }
      const raw=JSON.stringify(toApply);
      const d=JSON.parse(raw);
      if(!d||typeof d!=="object")return;
      const orig=localStorage.getItem(SNAP_KEY);
      localStorage.setItem(SNAP_KEY,raw);
      loadSnapshot();
      if(orig==null)localStorage.removeItem(SNAP_KEY);
      else localStorage.setItem(SNAP_KEY,orig);
      if(!fromSlotSeq){
        cycleCountRef.current=0;
        planStepRef.current=0;
        planTickRef.current=0;
        setPlanCurStep(0);
      }
      if(subXResetRef.current){
        subXPosRef.current=0;
        subXStepDispRef.current=subXOnRef.current?0:-1;
        setSubXStepDisp(subXOnRef.current?0:-1);
      }
      setActiveSlot(idx);
    }catch(e){}
  }

  function loadFromSlot(idx){
    const snap=slots[idx];
    if(!snap)return;
    applySlotSnap(snap,idx);
  }

  function queueOrLoadSlot(idx){
    const snap=slots[idx];
    if(!snap)return;
    if(playingRef.current){
      setQueuedSlot(q=>q===idx?-1:idx);
      return;
    }
    setQueuedSlot(-1);
    applySlotSnap(snap,idx);
  }

  function renameSlot(idx,name){
    try{
      const next=Array.from({length:MAX_SLOT_COUNT},(_,i)=>slotNames[i]||"");
      next[idx]=name.slice(0,18);
      setSlotNames(next);
      localStorage.setItem(SLOTS_KEY+".names",JSON.stringify(next));
    }catch(e){}
  }

  function resetSlotSeqRuntime(){
    slotSeqPosRef.current=0;
    slotSeqHoldRef.current=0;
    setSlotSeqPos(0);
    setSlotSeqHold(0);
  }

  /* ── derived ────────────────────────────────────────────── */
  const activeSteps=steps.slice(0,seqLen).filter(stepObj=>!stepObj.skip);
  const totalPulses=activeSteps.reduce((a,s)=>a+s.pulses,0);

  // Segment boundary helpers
  const SEG_COLORS=["#00dd88","#ffcc00","#ff7755","#44bbff","#cc88ff","#88ffaa"];
  const SEG_NAMES=["A","B","C","D","E","F"];
  function getSegBounds(len,sc,sp){
    const sections=Math.min(Math.max(1,sc),Math.max(1,len),6);
    const bounds=[0];
    for(let i=0;i<sections-1;i++){
      const min=bounds[bounds.length-1]+1;
      const max=len-((sections-1)-i);
      bounds.push(clamp(sp[i]??min,min,max));
    }
    bounds.push(len);
    return bounds;
  }
  const segBounds=getSegBounds(seqLen,segCount,segSplits);
  // which segment does step i belong to?
  function stepSegIdx(i){
    for(let s=0;s<segBounds.length-1;s++) if(i>=segBounds[s]&&i<segBounds[s+1]) return s;
    return 0;
  }
  // total pulses for full loop (all sections × their repeats)
  const totalLoopPulses=segBounds.slice(0,-1).reduce((sum,start,si)=>{
    const end=segBounds[si+1];
    const sp=steps.slice(start,end).filter(stepObj=>!stepObj.skip).reduce((a,stepObj)=>a+stepObj.pulses,0);
    return sum+sp*(segRepeats[si]||1);
  },0);
  const loopBars=(totalLoopPulses/16).toFixed(2);

  /* ── RENDER ─────────────────────────────────────────────── */
  const sc=SCALES[scaleName]||SCALES.chromatic;
  const pitchDegMax=Math.max(0,sc.length*pitchSpanOct-1);
  const COL_H=236; // taller pitch column for extended range

  // Click inside a pitch column to set pitch degree
  function handlePitchClick(e,stepIdx){
    const rect=e.currentTarget.getBoundingClientRect();
    const y=e.clientY-rect.top;
    const frac=clamp(1-(y/rect.height),0,1);
    const deg=Math.round(frac*pitchDegMax);
    updateStep(stepIdx,"pitch",deg);
  }

  return(
  <div className={"appSkin "+(visualMode==="beats"?"skinBeats":"skinRefined")} style={{background:T.bg,minHeight:"100vh",fontFamily:FF,color:T.mid,userSelect:"none"}}>
    <style>{`
      *{box-sizing:border-box}
      html,body{background:${T.bg};margin:0}
      ::-webkit-scrollbar{width:5px;height:5px;background:${T.bg}}
      ::-webkit-scrollbar-thumb{background:${T.border};border-radius:3px}
      input[type=range]{background:${T.border};accent-color:${T.accent}}
      button:hover{filter:brightness(1.25)}
      select{outline:none}
      .segcol-container{display:flex;gap:2px;width:100%;overflow-x:hidden;padding-bottom:6px}
      @keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes slotBlink{0%,100%{opacity:1}50%{opacity:.32}}
      .playingDot{animation:glow .55s ease-in-out infinite}
      .slotBlink{animation:slotBlink .55s step-end infinite}

      .skinRefined{
        background:
          radial-gradient(1200px 520px at 8% -10%, #123b2a66 0%, transparent 50%),
          radial-gradient(900px 420px at 92% -12%, #2b563f55 0%, transparent 56%),
          linear-gradient(180deg, #05130d 0%, #020a06 100%);
      }
      .skinRefined button{
        border-radius:7px !important;
        box-shadow:inset 0 1px 0 #9dffd01f, 0 3px 10px #0000002b;
      }
      .skinRefined button:hover{filter:brightness(1.18) saturate(1.14)}
      .skinRefined select,
      .skinRefined input[type="range"]{border-radius:6px}
      .skinRefined .topHeader{
        background:linear-gradient(180deg,#082117 0%,#04140d 100%) !important;
        border-bottom-color:#1f4533 !important;
        box-shadow:0 9px 26px #00150f80;
      }
      .skinRefined .mainBody > div{
        border-radius:8px !important;
        box-shadow:0 8px 24px #0015103f;
      }
      .skinBeats{
        background:
          radial-gradient(1150px 520px at 8% -12%, #f9731640 0%, transparent 54%),
          radial-gradient(980px 520px at 95% -16%, #22d3ee33 0%, transparent 56%),
          radial-gradient(760px 440px at 52% -18%, #a78bfa2f 0%, transparent 58%),
          linear-gradient(180deg,#05050f 0%,#020208 100%);
      }
      .skinBeats .topHeader{
        background:linear-gradient(180deg,#130f22 0%,#070812 100%) !important;
        border-bottom-color:#3040a0 !important;
        box-shadow:0 9px 26px #05030f9a;
      }
      .skinBeats .mainBody > div{
        border-color:#24306f !important;
        background:linear-gradient(180deg,#0d1020 0%,#070915 100%) !important;
        box-shadow:0 10px 26px #03040e7a;
      }
      .skinBeats button{
        border-color:#4858c0 !important;
        color:#22d3ee !important;
        background:#0a0f1f !important;
        box-shadow:inset 0 1px 0 #9fb0ff2f,0 3px 12px #02030a80;
      }
      .skinBeats button:hover{filter:brightness(1.17) saturate(1.24)}
      .skinBeats select,
      .skinBeats input[type="range"]{
        border-color:#3040a0 !important;
        color:#e0e0ff !important;
        background:#070d1c !important;
      }
    `}</style>

    {/* ══════════════════════════════════════════════════════
        HEADER
    ══════════════════════════════════════════════════════ */}
    <div className="topHeader" style={{
      background:"linear-gradient(180deg,#010f09 0%,#020d06 100%)",
      borderBottom:"1px solid "+T.border,
      padding:"10px 16px",
      display:"flex",justifyContent:"space-between",alignItems:"center",
      flexWrap:"wrap",gap:10,
    }}>
      {/* Title + status */}
      <div>
        <div style={{fontSize:30,fontWeight:900,letterSpacing:5,lineHeight:1,
          color:T.bright,textShadow:"0 0 40px "+T.accent+"55"}}>
          <span style={{color:T.mid,fontWeight:400}}>Skurky</span><span style={{color:T.accent}}>Mello</span>
        </div>
        <div style={{fontSize:10,color:T.dim,letterSpacing:2,marginTop:3,display:"flex",gap:10,flexWrap:"wrap"}}>
          <span style={{color:T.accent}}>{NOTE_NAMES[rootNote%12]}</span>
          <span>{scaleName}</span>
          <span>·</span>
          <span>{seqLen} steps</span>
          <span>{totalLoopPulses}p / {loopBars}bars</span>
            <span style={{
              display:"inline-flex",alignItems:"center",gap:6,padding:"1px 7px",
              border:"1px solid "+(perfStats.level==="SPICY"?T.warn:perfStats.level==="HOT"?T.coral:perfStats.level==="WARM"?T.gold:T.border),
              borderRadius:10,
              color:perfStats.level==="SPICY"?T.warn:perfStats.level==="HOT"?T.coral:perfStats.level==="WARM"?T.gold:T.mid,
            }}>
              <span>LOAD {perfStats.load}% {perfStats.level}</span>
              {perfStats.spark&&perfStats.spark.length>1&&(()=>{
                const pts=perfStats.spark;
                const W=48,H=14;
                const xs=pts.map((_,i)=>i*(W/(pts.length-1)));
                const ys=pts.map(v=>H-clamp(v,0,100)/100*H);
                const col=perfStats.level==="SPICY"?T.warn:perfStats.level==="HOT"?T.coral:perfStats.level==="WARM"?T.gold:T.mid;
                return <svg width={W} height={H} style={{display:"block",margin:"auto 0"}}>
                  <polyline points={pts.map((_,i)=>xs[i]+","+ys[i]).join(" ")} fill="none" stroke={col} strokeWidth="1.2" strokeLinejoin="round" opacity="0.8"/>
                </svg>;
              })()}
              <span style={{fontSize:9,color:T.dim,fontFamily:"monospace",whiteSpace:"nowrap"}}>cb <span style={{display:"inline-block",width:24,textAlign:"right"}}>{Math.round(perfStats.cbMs)}</span>ms · jit <span style={{display:"inline-block",width:24,textAlign:"right"}}>{Math.round(perfStats.jitterMs)}</span>ms</span>
            </span>
          <span style={{display:"inline-flex",minWidth:84,justifyContent:"flex-start"}}>
            {playing&&<span className="playingDot" style={{color:T.accent}}>◉ PLAYING</span>}
            {!playing&&<span style={{color:T.dim}}>◎ STOPPED</span>}
          </span>
        </div>
      </div>
      {/* BPM + controls */}
      <div style={{
        display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",
        background:T.panel2,border:"1px solid "+T.border,borderRadius:8,padding:"8px 10px",
      }}>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <div style={{fontSize:9,color:T.dim,letterSpacing:3}}>BPM</div>

            <button onClick={()=>setBpm(b=>Math.max(20,b-1))} style={BT({padding:"4px 8px"})}>−</button>
            <span style={{color:T.accent,fontSize:22,fontWeight:900,minWidth:42,textAlign:"center"}}>{bpm}</span>
            <button onClick={()=>setBpm(b=>Math.min(250,b+1))} style={BT({padding:"4px 8px"})}>+</button>
            <button onClick={tapTempo} style={BT({padding:"4px 8px",fontSize:9,borderColor:T.accent,color:T.accent})}>TAP</button>
          </div>
          <input type="range" min={20} max={250} value={bpm} onChange={e=>setBpm(+e.target.value)}
            style={{width:84,accentColor:T.accent}}/>
          <div style={{display:"flex",gap:2,marginTop:2}}>
            {[{label:"1/16",v:1},{label:"1/8",v:2},{label:"1/4",v:4}].map(o=>
              <button key={o.v} onClick={()=>setClockDiv(o.v)}
                style={BT({padding:"2px 5px",fontSize:8,
                  background:clockDiv===o.v?T.accent:"transparent",
                  color:clockDiv===o.v?"#000":T.dim,
                  borderColor:clockDiv===o.v?T.accent:T.border,
                  fontWeight:clockDiv===o.v?900:400,
                })}>{o.label}</button>
            )}
          </div>
        </div>
        {/* Scale/root quick controls */}
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          <div style={{display:"flex",gap:4,alignItems:"center"}}>
            <span style={{fontSize:9,color:T.dim,letterSpacing:2,width:34}}>ROOT</span>
            <select value={rootNote%12} onChange={e=>setRootNote(Math.floor(rootNote/12)*12+(+e.target.value))}
              style={{background:T.inputBg,border:"1px solid "+T.border,color:T.accent,fontFamily:FF,fontSize:11,padding:"3px 5px",fontWeight:700}}>
              {NOTE_NAMES.map((n,i)=><option key={i} value={i}>{n}</option>)}
            </select>
            <select value={Math.floor(rootNote/12)} onChange={e=>setRootNote((+e.target.value)*12+(rootNote%12))}
              style={{background:T.inputBg,border:"1px solid "+T.border,color:T.mid,fontFamily:FF,fontSize:11,padding:"3px 5px",width:46}}>
              {[2,3,4,5,6].map(o=><option key={o} value={o}>Oct{o-1}</option>)}
            </select>
          </div>
          <div style={{display:"flex",gap:4,alignItems:"center"}}>
            <span style={{fontSize:9,color:T.dim,letterSpacing:2,width:34}}>SCALE</span>
            <select value={scaleName} onChange={e=>setScaleName(e.target.value)}
              style={{background:T.inputBg,border:"1px solid "+T.border,color:T.mid,fontFamily:FF,fontSize:11,padding:"3px 5px",flex:1}}>
              {SCALE_NAMES.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        </div>
        {/* Sync buttons */}
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          <button onClick={()=>setMidiMode(m=>m==="OFF"?"SLAVE":m==="SLAVE"?"MASTER":"OFF")} style={BT({
            padding:"5px 10px",fontSize:10,
            borderColor:midiMode==="SLAVE"?"#44bb66":midiMode==="MASTER"?"#ffaa00":T.border,
            color:midiMode==="SLAVE"?"#44ee88":midiMode==="MASTER"?"#ffcc44":T.dim,
          })}>{midiMode==="SLAVE"?"⬇ MIDI SLAVE":midiMode==="MASTER"?"⬆ MIDI MASTER":"◎ MIDI"}</button>
          <button onClick={()=>setTabSync(m=>m==="OFF"?"SLAVE":m==="SLAVE"?"MASTER":"OFF")} style={BT({
            padding:"5px 10px",fontSize:10,
            borderColor:tabSync==="SLAVE"?"#44aaff":tabSync==="MASTER"?"#aa44ff":T.border,
            color:tabSync==="SLAVE"?"#66ccff":tabSync==="MASTER"?"#cc88ff":T.dim,
          })}>{tabSync==="SLAVE"?"⬇ TAB SLAVE":tabSync==="MASTER"?"⬆ TAB MASTER":"◎ TAB SYNC"}</button>
        </div>
        <button onClick={()=>setVisualMode(v=>VISUAL_MODES[(VISUAL_MODES.indexOf(v)+1+VISUAL_MODES.length)%VISUAL_MODES.length])} style={BT({
          padding:"8px 10px",
          borderColor:visualMode==="beats"?T.cyan:T.border,
          color:visualMode==="beats"?T.cyan:T.dim,
          background:visualMode==="beats"?T.panel2:"transparent",
        })}>STYLE {visualMode==="refined"?"REFINED":"SKURKYBEATS"}</button>
        <button onClick={()=>setShowSettings(s=>!s)} style={BT({
          padding:"8px 10px",borderColor:showSettings?T.purple:T.border,color:showSettings?T.purple:T.dim,
        })}>⚙</button>
        <button onClick={resetAll} style={BT({
          padding:"8px 10px",borderColor:T.warn,color:T.warn,background:"#2a090d",
        })}>RESET ALL</button>
        {/* PLAY */}
        <button onClick={handlePlay} style={{
          padding:"9px 16px",fontFamily:FF,fontSize:12,letterSpacing:2,cursor:"pointer",fontWeight:900,
          background:playing?"#1c070d":"#062014",
          border:"2px solid "+(playing?"#ff1155":"#00ff77"),
          color:playing?"#ff3377":"#00ff88",
          boxShadow:playing?"0 0 16px #ff115544":"0 0 16px #00ff7730",
          transition:"all .15s",borderRadius:2,
        }}>{playing?"◼  STOP":"▶  PLAY"}</button>
      </div>
    </div>

    {/* ══════════════════════════════════════════════════════
        MIDI DEVICE SELECTOR
    ══════════════════════════════════════════════════════ */}
    {(midiMode!=="OFF")&&(
    <div style={{background:T.panel,border:"1px solid "+T.border,borderRadius:4,padding:"12px 14px",marginBottom:10}}>
      {midiError&&<div style={{fontSize:11,color:"#ff4444",marginBottom:8}}>⚠ {midiError}</div>}
      {midiMode==="SLAVE"&&(
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:T.dim,letterSpacing:2,marginBottom:5}}>INPUT PORT</div>
          <select value={midiInputId} onChange={e=>setMidiInputId(e.target.value)}
            style={{background:T.inputBg,border:"1px solid "+T.border,color:T.bright,fontFamily:FF,fontSize:12,padding:"5px 8px",width:"100%"}}>
            {midiPorts.inputs.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            {midiPorts.inputs.length===0&&<option value="all">No MIDI inputs detected</option>}
          </select>
        </div>
      )}
      {midiMode==="MASTER"&&(
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:T.dim,letterSpacing:2,marginBottom:5}}>OUTPUT PORT</div>
          <select value={midiOutputId} onChange={e=>setMidiOutputId(e.target.value)}
            style={{background:T.inputBg,border:"1px solid "+T.border,color:T.bright,fontFamily:FF,fontSize:12,padding:"5px 8px",width:"100%"}}>
            {midiPorts.outputs.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            {midiPorts.outputs.length===0&&<option value="">No MIDI outputs detected</option>}
          </select>
          <div style={{marginTop:9,border:"1px solid "+T.border,borderRadius:4,padding:"8px 10px",background:T.panel2}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{fontSize:10,color:T.dim,letterSpacing:1}}>EXT MIDI NOTES</span>
              <button onClick={()=>setMidiNoteOutOn(v=>!v)} style={BT({
                padding:"3px 8px",fontSize:10,
                borderColor:midiNoteOutOn?T.accent:T.border,
                color:midiNoteOutOn?T.accent:T.dim,
                background:midiNoteOutOn?T.panel:"transparent",
              })}>{midiNoteOutOn?"◉ ON":"○ OFF"}</button>
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:8}}>
              <span style={{fontSize:10,color:T.dim}}>LEAD CH</span>
              <select value={midiLeadCh} onChange={e=>setMidiLeadCh(clamp(Math.round(+e.target.value||1),1,16))}
                style={{background:T.inputBg,border:"1px solid "+T.border,color:T.bright,fontFamily:FF,fontSize:11,padding:"3px 6px"}}>
                {Array.from({length:16},(_,i)=><option key={i+1} value={i+1}>{i+1}</option>)}
              </select>
              <span style={{fontSize:10,color:T.dim}}>SUB CH</span>
              <select value={midiSubCh} onChange={e=>setMidiSubCh(clamp(Math.round(+e.target.value||2),1,16))}
                style={{background:T.inputBg,border:"1px solid "+T.border,color:T.bright,fontFamily:FF,fontSize:11,padding:"3px 6px"}}>
                {Array.from({length:16},(_,i)=><option key={i+1} value={i+1}>{i+1}</option>)}
              </select>
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{fontSize:10,color:T.dim}}>LEN</span>
              {[ ["step","STEP"], ["fixed","FIXED"] ].map(([id,lbl])=>(
                <button key={id} onClick={()=>setMidiLenMode(id)} style={BT({
                  padding:"2px 7px",fontSize:10,
                  borderColor:midiLenMode===id?T.cyan:T.border,
                  color:midiLenMode===id?T.cyan:T.dim,
                  background:midiLenMode===id?T.panel:"transparent",
                })}>{lbl}</button>
              ))}
              {midiLenMode==="fixed"&&(
                <>
                  <input type="range" min={20} max={2000} step={10} value={midiFixedLenMs}
                    onChange={e=>setMidiFixedLenMs(clamp(Math.round(+e.target.value||180),20,2000))}
                    style={{width:130,accentColor:T.cyan}}/>
                  <span style={{fontSize:10,color:T.cyan,minWidth:46}}>{midiFixedLenMs}ms</span>
                </>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
    )}

    {/* ══════════════════════════════════════════════════════
      MAIN BODY
    ══════════════════════════════════════════════════════ */}
    <div className="mainBody" style={{padding:"12px 14px"}}>

    {/* ══════════════ PITCH SEQUENCER ═══════════════════ */}
    <div style={{background:T.panel,border:"1px solid "+T.border,borderRadius:4,padding:"12px 14px",marginBottom:10}}>

      {/* ── Header bar ── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",mb:10,flexWrap:"wrap",gap:8,marginBottom:10}}>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{fontSize:10,color:T.dim,letterSpacing:3}}>STEPS</span>
          {[4,5,6,7,8,10,12,16,20,24,28,32].map(n=>(
            <button key={n} onClick={()=>setSeqLen(n)} style={BT({
              padding:"4px 9px",fontSize:11,
              borderColor:seqLen===n?T.accent:T.border,
              color:seqLen===n?T.accent:T.dim,
              background:seqLen===n?T.panel2:"transparent",
              fontWeight:seqLen===n?900:400,
            })}>{n}</button>
          ))}
          <span style={{color:T.dim,margin:"0 4px"}}>|</span>
          <span style={{fontSize:10,color:T.dim,letterSpacing:3}}>PITCH SPAN</span>
          {[1,2,3].map(n=>(
            <button key={n} onClick={()=>setPitchSpanOct(n)} style={BT({
              padding:"4px 8px",fontSize:11,
              borderColor:pitchSpanOct===n?T.cyan:T.border,
              color:pitchSpanOct===n?T.cyan:T.dim,
              background:pitchSpanOct===n?T.panel2:"transparent",
            })}>{n}o</button>
          ))}
          <span style={{color:T.dim,margin:"0 4px"}}>|</span>
          <span style={{fontSize:10,color:T.dim,letterSpacing:3}}>OCT</span>
          {[-2,-1,0,1,2].map(o=>(
            <button key={o} onClick={()=>setGlobalOct(o)} style={BT({
              padding:"4px 8px",fontSize:11,
              borderColor:globalOct===o?T.gold:T.border,
              color:globalOct===o?T.gold:T.dim,
              background:globalOct===o?T.panel2:"transparent",
            })}>{o>0?"+"+o:o}</button>
          ))}
        </div>
        <div style={{display:"flex",gap:5}}>
          <button onClick={exportMidi} style={BT({padding:"5px 12px",fontSize:10,borderColor:T.cyan,color:T.cyan})}>MIDI</button>
          <button onClick={exportPatch} style={BT({padding:"5px 12px",fontSize:10,borderColor:T.accent,color:T.accent})}>PATCH EXPORT</button>
          <button onClick={triggerPatchImport} style={BT({padding:"5px 12px",fontSize:10,borderColor:T.accent,color:T.accent})}>PATCH IMPORT</button>
          <input ref={patchImportRef} type="file" accept=".json,application/json" onChange={importPatchFromFile} style={{display:"none"}}/>
          <button onClick={saveSnapshot} style={BT({padding:"5px 12px",fontSize:10,borderColor:T.gold,color:T.gold})}>💾 SAVE</button>
          <button onClick={loadSnapshot} style={BT({padding:"5px 12px",fontSize:10,borderColor:T.cyan,color:T.cyan})}>📂 LOAD</button>
          <button onClick={randomizeSteps} style={BT({padding:"5px 12px",fontSize:10,borderColor:T.purple,color:T.purple})}>⚡ RANDOM</button>
          <button onClick={clearSteps} style={BT({padding:"5px 10px",fontSize:10})}>◻ CLEAR</button>
        </div>
      </div>

      <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap",marginBottom:10}}>
        <span style={{fontSize:9,color:T.dim,letterSpacing:2}}>RANDOMIZE:</span>
        {[
          ["pitch","PITCH"],["pulses","PUL"],["ratchet","RAT"],["gate","GATE"],["octave","OCT"],
          ["accent","ACC"],["sub","SUB"],["slide","SLD"],["skip","SKIP"],["prob","PROB"],["samp","SAMP"],
        ].map(([k,lbl])=>(
          <button key={k} onClick={()=>setRandMask(r=>({...r,[k]:!r[k]}))} style={BT({
            padding:"3px 7px",fontSize:9,
            borderColor:randMask[k]?T.purple:T.border,
            color:randMask[k]?T.purple:T.dim,
            background:randMask[k]?T.panel2:"transparent",
          })}>{lbl}</button>
        ))}
        <button onClick={()=>setRandMask({pitch:true,pulses:true,ratchet:true,gate:true,octave:true,accent:true,sub:true,slide:true,skip:true,prob:true,samp:true})}
          style={BT({padding:"3px 7px",fontSize:9,borderColor:T.accent,color:T.accent})}>ALL</button>
        <button onClick={()=>setRandMask({pitch:false,pulses:false,ratchet:false,gate:false,octave:false,accent:false,sub:false,slide:false,skip:false,prob:false,samp:false})}
          style={BT({padding:"3px 7px",fontSize:9})}>NONE</button>
      </div>

      {/* ── Section controls ── */}
      <div style={{background:T.panel2,border:"1px solid "+T.border,borderRadius:3,padding:"8px 12px",marginBottom:12}}>
        <div style={{display:"flex",gap:8,alignItems:"flex-start",flexWrap:"wrap"}}>

          {SEG_NAMES.map((name,si)=>{
            const enabled=si<segCount;
            const col=SEG_COLORS[si%SEG_COLORS.length];
            const from=(segBounds[si]??0)+1;
            const to=segBounds[si+1]??seqLen;
            const splitIdx=si-1;
            const canExist=si<Math.min(6,seqLen);
            const canToggle=si>0&&canExist;
            return(
              <div key={name} style={{
                flex:"1 1 160px",
                border:"1px solid "+(enabled?col+"88":T.border),
                borderRadius:3,padding:"8px 10px",minWidth:150,
                opacity:canExist?1:0.35,
              }}>
                <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
                  <span style={{fontSize:14,color:enabled?col:T.dim,fontWeight:900,letterSpacing:2}}>{name}</span>
                  {canToggle&&(
                    <button onClick={()=>setSegCount(c=>c>=si+1?si:Math.min(si+1,seqLen))} style={BT({
                      padding:"2px 8px",fontSize:9,
                      borderColor:enabled?col:T.border,
                      color:enabled?col:T.dim,
                      background:enabled?T.panel2:"transparent",
                    })}>{enabled?"ON":"OFF"}</button>
                  )}
                  {enabled&&(
                    <button onClick={()=>setSegSkip(prev=>{const nx=[...prev];nx[si]=!nx[si];return nx;})} style={BT({
                      padding:"2px 8px",fontSize:9,
                      borderColor:segSkip[si]?T.warn:T.border,
                      color:segSkip[si]?T.warn:T.dim,
                      background:segSkip[si]?T.panel2:"transparent",
                    })}>{segSkip[si]?"SKIPPED":"SKIP"}</button>
                  )}
                  {enabled&&<span style={{fontSize:9,color:T.dim}}>steps {from}–{to}</span>}
                  {enabled&&curSegDisp===si&&playing&&<span style={{color:col,fontSize:9}}>◉</span>}
                </div>

                {enabled&&si>0&&(
                  <>
                    <div style={{display:"flex",gap:3,alignItems:"center",marginBottom:5}}>
                      <span style={{fontSize:9,color:T.dim}}>starts</span>
                      <button onClick={()=>setSegSplits(prev=>{
                        const sp=[...prev];
                        const min=splitIdx===0?1:(sp[splitIdx-1]??1)+1;
                        const max=seqLen-((segCount-1)-splitIdx);
                        sp[splitIdx]=clamp((sp[splitIdx]??min)-1,min,max);
                        for(let k=splitIdx+1;k<segCount-1;k++){
                          const minK=(sp[k-1]??1)+1;
                          const maxK=seqLen-((segCount-1)-k);
                          sp[k]=clamp(sp[k]??minK,minK,maxK);
                        }
                        return sp;
                      })} style={BT({padding:"2px 6px",borderColor:col,color:col})}>◀</button>
                      <span style={{fontSize:11,color:T.bright,minWidth:24,textAlign:"center"}}>{from}</span>
                      <button onClick={()=>setSegSplits(prev=>{
                        const sp=[...prev];
                        const min=splitIdx===0?1:(sp[splitIdx-1]??1)+1;
                        const max=seqLen-((segCount-1)-splitIdx);
                        sp[splitIdx]=clamp((sp[splitIdx]??min)+1,min,max);
                        for(let k=splitIdx+1;k<segCount-1;k++){
                          const minK=(sp[k-1]??1)+1;
                          const maxK=seqLen-((segCount-1)-k);
                          sp[k]=clamp(sp[k]??minK,minK,maxK);
                        }
                        return sp;
                      })} style={BT({padding:"2px 6px",borderColor:col,color:col})}>▶</button>
                    </div>
                  </>
                )}

                {enabled&&(
                  <div style={{display:"flex",gap:3,alignItems:"center"}}>
                    <span style={{fontSize:9,color:T.dim}}>×</span>
                    {[1,2,3,4].map(r=>(
                      <button key={r} onClick={()=>{const nr=[...segRepeats];nr[si]=r;setSegRepeats(nr);}} style={BT({
                        padding:"3px 8px",fontSize:11,fontWeight:900,
                        borderColor:segRepeats[si]===r?col:T.border,
                        color:segRepeats[si]===r?col:T.dim,
                        background:segRepeats[si]===r?T.panel2:"transparent",
                      })}>{r}</button>
                    ))}
                  </div>
                )}

                {enabled&&(
                  <div style={{display:"flex",gap:3,alignItems:"center",marginTop:6}}>
                    <span style={{fontSize:9,color:T.dim}}>DIR</span>
                    {SEG_DIR_OPTIONS.map(d=>{
                      const on=(segDirection[si]||"fwd")===d;
                      const lbl=d==="rev"?"REV":"FWD";
                      return <button key={d} onClick={()=>setSegDirection(prev=>{
                        const nx=[...prev];
                        nx[si]=d;
                        return nx;
                      })} style={BT({
                        padding:"2px 6px",fontSize:9,
                        borderColor:on?col:T.border,
                        color:on?col:T.dim,
                        background:on?T.panel2:"transparent",
                      })}>{lbl}</button>;
                    })}
                  </div>
                )}

                {enabled&&(
                  <div style={{display:"flex",gap:3,alignItems:"center",marginTop:4,flexWrap:"wrap"}}>
                    <span style={{fontSize:9,color:T.dim}}>MODE</span>
                    {SEG_MODE_OPTIONS.map(m=>{
                      const on=(segMode[si]||"linear")===m;
                      const lbl=m==="pingpong"?"P-P":m==="random"?"RND":"LIN";
                      return <button key={m} onClick={()=>setSegMode(prev=>{
                        const nx=[...prev];
                        nx[si]=m;
                        return nx;
                      })} style={BT({
                        padding:"2px 6px",fontSize:9,
                        borderColor:on?col:T.border,
                        color:on?col:T.dim,
                        background:on?T.panel2:"transparent",
                      })}>{lbl}</button>;
                    })}
                  </div>
                )}
              </div>
            );
          })}

          {/* MASTER RESET LENGTH */}
          <div style={{flex:"1 1 180px",border:"1px solid "+T.border,borderRadius:3,padding:"8px 10px",minWidth:170}}>
            <div style={{fontSize:9,color:T.dim,letterSpacing:2,marginBottom:6}}>RESET AFTER</div>
            <div style={{display:"flex",gap:3,flexWrap:"wrap",marginBottom:5}}>
              {[[0,"off"],[16,"1bar"],[32,"2bar"],[64,"4bar"],[128,"8bar"],[256,"16bar"]].map(([v,lbl])=>(
                <button key={v} onClick={()=>setMasterLen(v)} style={BT({
                  padding:"3px 7px",fontSize:9,
                  borderColor:masterLen===v?T.purple:T.border,
                  color:masterLen===v?T.purple:T.dim,
                  background:masterLen===v?T.panel2:"transparent",
                })}>{lbl}</button>
              ))}
            </div>
            <div style={{fontSize:8,color:T.dim,lineHeight:1.4}}>
              Forcibly resets seq to step 1 every N 16th notes — keeps melody in sync with fixed-length drum loops
            </div>
          </div>

        </div>
        {/* loop info bar */}
        <div style={{fontSize:9,color:T.dim,marginTop:7}}>
          loop: <span style={{color:T.bright}}>{totalLoopPulses}</span> pulses
          = <span style={{color:T.bright}}>{loopBars}</span> bars
          {masterLen>0&&<span style={{color:T.purple}}> · reset every {masterLen/16} bar{masterLen/16>1?"s":""}</span>}
        </div>
      </div>

      {/* ══ PITCH COLUMN GRID ══════════════════════════════ */}
      {/* Melody contour previewer */}
      <div style={{
        height:4,borderRadius:2,marginBottom:6,display:"flex",gap:2,alignItems:"flex-end",
        overflowX:"hidden",
      }}>
        {steps.slice(0,seqLen).map((st,i)=>{
          const si=stepSegIdx(i);
          const frac=(pitchDegMax>0?(st.pitch/pitchDegMax):0.5);
          return <div key={i} style={{
            flex:1,height:Math.max(1,Math.round(frac*4))+"px",
            background:SEG_COLORS[si]+(curStep===i&&playing?"":"55"),
            borderRadius:1,transition:"height .1s",
          }}/>;
        })}
      </div>

      <div className="segcol-container">
        {steps.slice(0,seqLen).map((st,i)=>{
          const isActive=curStep===i&&playing;
          const isEdit=editStep===i;
          const si=stepSegIdx(i);
          const col=SEG_COLORS[si];
          const pitchFrac=pitchDegMax>0?(st.pitch/pitchDegMax):0.5;
          const scLen=Math.max(1,sc.length);
          const deg=((st.pitch%(scLen*Math.max(1,pitchSpanOct)))+(scLen*Math.max(1,pitchSpanOct)))%(scLen*Math.max(1,pitchSpanOct));
          const noteIdx=(rootNote%12+sc[deg%scLen])%12;
          const isSegStart=i>0&&i===segBounds[si];
          return(
            <div key={i} style={{
              display:"flex",flexDirection:"column",alignItems:"stretch",
              flex:"1 1 0",width:"auto",minWidth:0,
              marginLeft:isSegStart&&segCount>1?10:0,
              opacity:st.skip?0.35:1,
            }}>
              {/* Segment label stripe */}
              <div style={{
                height:3,borderRadius:"2px 2px 0 0",
                background:col+(isActive?"":"55"),
                marginBottom:1,
                boxShadow:isActive?"0 0 8px "+col:"none",
                transition:"box-shadow .1s",
              }}/>

              {/* ── PITCH COLUMN (clickable) ── */}
              <div
                onClick={e=>{setEditStep(i);handlePitchClick(e,i);}}
                onContextMenu={e=>{e.preventDefault();updateStep(i,"skip",!st.skip);}}
                title={`Step ${i+1} – click: set pitch, right-click: skip`}
                style={{
                  height:COL_H,position:"relative",cursor:"crosshair",
                  background:isActive?T.stepActive:isEdit?"#061510":T.stepOff,
                  border:"1px solid "+(isActive?col:isEdit?col+"88":T.border),
                  borderRadius:2,overflow:"hidden",
                  boxShadow:isActive?"0 0 20px "+col+"66":"none",
                  transition:"box-shadow .12s",
                }}>
                {/* Scale degree grid lines */}
                {Array.from({length:pitchDegMax+1},(_,di)=>(
                  <div key={di} style={{
                    position:"absolute",left:0,right:0,
                    bottom:Math.round((di/(Math.max(pitchDegMax,1)))*COL_H)+"px",
                    height:1,background:T.border,opacity:.7,
                  }}/>
                ))}
                {/* Pitch fill */}
                <div style={{
                  position:"absolute",left:0,right:0,bottom:0,
                  height:Math.max(2,Math.round(pitchFrac*(COL_H-2)))+"px",
                  background:st.gate==="rest"
                    ? T.dim+"33"
                    : `linear-gradient(180deg,${col}${isActive?"ff":"88"} 0%,${col}${isActive?"44":"22"} 100%)`,
                  borderRadius:"1px 1px 0 0",
                  transition:"height .08s",
                }}/>
                {/* Note name */}
                {st.gate!=="rest"&&(
                  <div style={{
                    position:"absolute",
                    bottom:Math.max(4,Math.round(pitchFrac*(COL_H-2))-16)+"px",
                    left:0,right:0,textAlign:"center",
                    fontSize:st.octave!==0?9:11,fontWeight:900,
                    color:isActive?col:T.bright,
                    textShadow:isActive?"0 0 10px "+col:"none",
                    pointerEvents:"none",lineHeight:1,
                  }}>
                    {NOTE_NAMES[noteIdx]}
                    {st.octave!==0&&<div style={{fontSize:8,color:T.gold,lineHeight:1}}>{st.octave>0?"+":""}{st.octave}</div>}
                  </div>
                )}
                {st.gate==="rest"&&(
                  <div style={{position:"absolute",top:"50%",left:0,right:0,textAlign:"center",
                    transform:"translateY(-50%)",fontSize:14,color:T.dim,pointerEvents:"none"}}>○</div>
                )}
                {/* Active notch at top of fill */}
                {isActive&&(
                  <div style={{
                    position:"absolute",bottom:Math.max(0,Math.round(pitchFrac*(COL_H-2))-2)+"px",
                    left:0,right:0,height:3,background:col,
                    boxShadow:"0 0 6px "+col,
                  }}/>
                )}
              </div>

              {/* ── STEP INFO BAR ── */}
              <div style={{
                background:T.stepOff,border:"1px solid "+T.border,borderTop:"none",
                borderRadius:"0 0 2px 2px",padding:"3px 3px 4px",
                display:"flex",flexDirection:"column",alignItems:"center",gap:2,
              }}>
                {/* Step number */}
                <div style={{fontSize:8,color:isActive?col:T.dim,letterSpacing:1}}>{i+1}</div>
                {/* Pulse count — +/- buttons directly on column */}
                <div style={{display:"flex",gap:1,justifyContent:"center",alignItems:"center"}}>
                  <button onClick={e=>{e.stopPropagation();updateStep(i,"pulses",Math.max(1,st.pulses-1));}} style={{
                    background:"transparent",border:"none",cursor:"pointer",color:T.dim,
                    fontFamily:FF,fontSize:11,padding:"0 2px",lineHeight:1,
                  }}>-</button>
                  <span style={{
                    fontSize:11,fontWeight:900,
                    color:isActive&&curPulse>0?col:st.pulses>1?T.gold:T.dim,
                    minWidth:16,textAlign:"center",
                  }}>{st.pulses>1?"×"+st.pulses:"·"}</span>
                  <button onClick={e=>{e.stopPropagation();updateStep(i,"pulses",Math.min(8,st.pulses+1));}} style={{
                    background:"transparent",border:"none",cursor:"pointer",color:T.dim,
                    fontFamily:FF,fontSize:11,padding:"0 2px",lineHeight:1,
                  }}>+</button>
                </div>
                {st.ratchet>1&&<div style={{fontSize:8,color:T.purple,lineHeight:1}}>r{st.ratchet}</div>}
                {/* Gate mode - cycle on click */}
                <button onClick={()=>{
                  const modes=GATE_MODES.map(g=>g.id);
                  const idx=modes.indexOf(st.gate);
                  updateStep(i,"gate",modes[(idx+1)%modes.length]);
                }} title={GATE_MODES.find(g=>g.id===st.gate)?.title} style={{
                  background:"transparent",border:"none",cursor:"pointer",
                  fontSize:10,color:st.gate==="rest"?T.dim:st.gate==="hold"?T.cyan:st.gate==="multi"?T.gold:T.mid,
                  fontFamily:FF,padding:0,lineHeight:1,
                }}>
                  {GATE_MODES.find(g=>g.id===st.gate)?.label}
                </button>
                {/* Flag dots row */}
                <div style={{display:"flex",gap:3}}>
                  <div title="Accent" onClick={()=>updateStep(i,"accent",!st.accent)} style={{
                    width:5,height:5,borderRadius:"50%",cursor:"pointer",
                    background:st.accent?T.warn:T.border,
                    boxShadow:st.accent?"0 0 5px "+T.warn:"none",
                  }}/>
                  <div title="Slide" onClick={()=>updateStep(i,"slide",!st.slide)} style={{
                    width:5,height:5,borderRadius:"50%",cursor:"pointer",
                    background:st.slide?T.cyan:T.border,
                    boxShadow:st.slide?"0 0 5px "+T.cyan:"none",
                  }}/>
                  <div title="Sub Trigger" onClick={()=>updateStep(i,"sub",!st.sub)} style={{
                    width:5,height:5,borderRadius:"50%",cursor:"pointer",
                    background:st.sub?T.gold:T.border,
                    boxShadow:st.sub?"0 0 5px "+T.gold:"none",
                  }}/>
                  {st.prob<1&&<div style={{
                    width:5,height:5,borderRadius:"50%",
                    background:T.purple,opacity:.7,
                  }}/>}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* ── STEP DETAIL EDITOR (shown when a step is clicked) ── */}
      {editStep<seqLen&&(()=>{
        const st=steps[editStep];
        const si=stepSegIdx(editStep);
        const col=SEG_COLORS[si];
        return(
          <div style={{
            background:T.panel2,border:"1px solid "+col+"88",borderRadius:3,
            padding:"12px 14px",marginTop:10,
          }}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:10,color:col,letterSpacing:3,fontWeight:700}}>
                STEP {editStep+1} DETAIL
              </div>
              <div style={{fontSize:9,color:T.dim}}>
                {NOTE_NAMES[(rootNote%12+sc[((st.pitch%Math.max(sc.length,1))+Math.max(sc.length,1))%Math.max(sc.length,1)])%12]}
                {st.octave>0?"+":""}{st.octave!==0?st.octave:""}
                &nbsp;·&nbsp;{st.pulses}× pulse&nbsp;·&nbsp;{GATE_MODES.find(g=>g.id===st.gate)?.title}
              </div>
            </div>
            <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap",marginBottom:10}}>
              <button onClick={()=>setEditStep(s=>Math.max(0,s-1))} style={BT({padding:"4px 8px",fontSize:10,borderColor:col,color:col})}>◀</button>
              {Array.from({length:seqLen},(_,i)=>(
                <button key={i} onClick={()=>setEditStep(i)} style={BT({
                  padding:"4px 7px",fontSize:10,minWidth:28,
                  borderColor:editStep===i?col:T.border,
                  color:editStep===i?col:T.dim,
                  background:editStep===i?T.panel2:"transparent",
                  fontWeight:editStep===i?900:400,
                })}>{i+1}</button>
              ))}
              <button onClick={()=>setEditStep(s=>Math.min(seqLen-1,s+1))} style={BT({padding:"4px 8px",fontSize:10,borderColor:col,color:col})}>▶</button>
              <span style={{fontSize:9,color:T.dim,marginLeft:4}}>Arrows: ←/→ step, ↑/↓ note</span>
            </div>
            <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
              {/* Scale degree */}
              <div style={{flex:"1 1 180px"}}>
                <div style={{fontSize:9,color:T.dim,letterSpacing:2,marginBottom:5}}>NOTE  <span style={{color:col,fontWeight:700}}>{NOTE_NAMES[(rootNote%12+sc[((st.pitch%Math.max(sc.length,1))+Math.max(sc.length,1))%Math.max(sc.length,1)])%12]}</span></div>
                <div style={{display:"flex",gap:3,flexWrap:"wrap",marginBottom:8}}>
                  {Array.from({length:pitchDegMax+1},(_,di)=>{
                    const ni=(rootNote%12+sc[di%Math.max(sc.length,1)])%12;
                    return<button key={di} onClick={()=>updateStep(editStep,"pitch",di)} style={BT({
                      padding:"5px 9px",fontSize:11,fontWeight:st.pitch===di?900:400,
                      borderColor:st.pitch===di?col:T.border,
                      color:st.pitch===di?col:T.mid,
                      background:st.pitch===di?T.panel2:"transparent",
                    })}>{NOTE_NAMES[ni]}</button>;
                  })}
                </div>
                <div style={{fontSize:9,color:T.dim,letterSpacing:2,marginBottom:4}}>OCTAVE</div>
                <div style={{display:"flex",gap:3}}>
                  {[-2,-1,0,1,2].map(o=>(
                    <button key={o} onClick={()=>updateStep(editStep,"octave",o)} style={BT({
                      padding:"4px 8px",fontSize:11,
                      borderColor:st.octave===o?T.gold:T.border,
                      color:st.octave===o?T.gold:T.dim,
                      background:st.octave===o?T.panel2:"transparent",
                    })}>{o>0?"+"+o:o}</button>
                  ))}
                </div>
              </div>
              {/* Pulses */}
              <div style={{minWidth:140}}>
                <div style={{fontSize:9,color:T.dim,letterSpacing:2,marginBottom:5}}>
                  PULSES <span style={{color:T.accent}}>{st.pulses}×</span>
                  <span style={{color:T.dim,fontSize:8,marginLeft:6}}>step holds for {st.pulses} 16th-notes</span>
                </div>
                <div style={{display:"flex",gap:3}}>
                  {[1,2,3,4,5,6,7,8].map(n=>(
                    <button key={n} onClick={()=>updateStep(editStep,"pulses",n)} style={BT({
                      padding:"5px 8px",fontSize:11,
                      borderColor:st.pulses===n?T.accent:T.border,
                      color:st.pulses===n?T.accent:T.dim,
                      background:st.pulses===n?T.panel2:"transparent",
                    })}>{n}</button>
                  ))}
                </div>
                <div style={{fontSize:9,color:T.dim,letterSpacing:2,marginTop:8,marginBottom:5}}>
                  RATCHET <span style={{color:T.purple}}>x{st.ratchet}</span>
                </div>
                <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                  {[1,2,3,4,5,6,7,8].map(n=>(
                    <button key={"r"+n} onClick={()=>updateStep(editStep,"ratchet",n)} style={BT({
                      padding:"5px 8px",fontSize:11,
                      borderColor:st.ratchet===n?T.purple:T.border,
                      color:st.ratchet===n?T.purple:T.dim,
                      background:st.ratchet===n?T.panel2:"transparent",
                    })}>{n}</button>
                  ))}
                </div>
              </div>
              {/* Gate mode */}
              <div style={{minWidth:150}}>
                <div style={{fontSize:9,color:T.dim,letterSpacing:2,marginBottom:5}}>GATE MODE</div>
                <div style={{display:"flex",gap:3,marginBottom:5}}>
                  {GATE_MODES.map(gm=>(
                    <button key={gm.id} onClick={()=>updateStep(editStep,"gate",gm.id)} title={gm.title} style={BT({
                      padding:"6px 10px",fontSize:13,
                      borderColor:st.gate===gm.id?T.cyan:T.border,
                      color:st.gate===gm.id?T.cyan:T.dim,
                      background:st.gate===gm.id?T.panel2:"transparent",
                    })}>{gm.label}</button>
                  ))}
                </div>
                <div style={{fontSize:9,color:T.dim}}>{GATE_MODES.find(g=>g.id===st.gate)?.title}</div>
              </div>
              {/* Flags */}
              <div style={{minWidth:130}}>
                <div style={{fontSize:9,color:T.dim,letterSpacing:2,marginBottom:5}}>FLAGS</div>
                <div style={{display:"flex",gap:5,marginBottom:7}}>
                  {[["SLIDE",T.cyan,"slide"],["ACCENT",T.warn,"accent"],["SUB",T.gold,"sub"],["SKIP",T.dim,"skip"]].map(([lbl,c,key])=>(
                    <button key={key} onClick={()=>updateStep(editStep,key,!st[key])} style={BT({
                      padding:"5px 8px",fontSize:10,
                      borderColor:st[key]?c:T.border,color:st[key]?c:T.dim,
                      background:st[key]?T.panel2:"transparent",
                    })}>{lbl}</button>
                  ))}
                </div>
                <div style={{fontSize:9,color:T.dim,letterSpacing:2,marginBottom:4}}>
                  PROB <span style={{color:T.purple}}>{Math.round(st.prob*100)}%</span>
                </div>
                <input type="range" min={0} max={1} step={.05} value={st.prob}
                  onChange={e=>updateStep(editStep,"prob",+e.target.value)}
                  style={{width:"100%",accentColor:T.purple}}/>
              </div>
              {/* Sample slot */}
              <div style={{minWidth:150}}>
                <div style={{fontSize:9,color:sampleOn?T.cyan:T.dim,letterSpacing:2,marginBottom:5}}>SAMPLE{!sampleOn&&<span style={{color:T.dim,fontSize:8,marginLeft:6,letterSpacing:0}}>(layer off)</span>}</div>
                <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:6}}>
                  {[["OFF",0]].concat(sampleSlots.map((sl,i)=>[String.fromCharCode(65+i),i+1])).map(([lbl,n])=>{
                    const on=Math.round(st.samp||0)===n;
                    const loaded=n===0||!!(sampleSlots[n-1]&&sampleSlots[n-1].hasBuf);
                    return (
                      <button key={n} onClick={()=>updateStep(editStep,"samp",n)} title={(n>0&&!loaded)?"slot empty":""} style={BT({
                        padding:"5px 9px",fontSize:10,fontWeight:on?900:600,
                        borderColor:on?T.cyan:T.border,
                        color:on?T.cyan:(loaded?T.mid:T.dim),
                        background:on?T.panel2:"transparent",
                        opacity:(n>0&&!loaded)?0.55:1,
                      })}>{lbl}</button>
                    );
                  })}
                </div>
                <div style={{fontSize:8,color:T.dim,lineHeight:1.5}}>Which sample slot fires on this step. Note pitch still comes from the step; SLIDE glides it.</div>
              </div>
            </div>
          </div>
        );
      })()}
    </div>

    {/* ══ SAVE SLOTS ════════════════════════════════════ */}
    <div style={{background:T.panel2,border:"1px solid "+(showSlots?(slotSeqOn?T.cyan:T.border):T.border),borderRadius:3,padding:"7px 12px",marginBottom:10}}>
      <div onClick={()=>setShowSlots(v=>!v)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",marginBottom:showSlots?8:0}}>
        <div style={{fontSize:8,color:T.dim,letterSpacing:2}}>
          SAVE SLOTS <span style={{fontSize:8,color:slotSeqOn?T.cyan:T.dim,marginLeft:8}}>SEQ {slotSeqOn?"◉ ON":"○ OFF"}</span>
        </div>
        <span style={{fontSize:11,color:T.dim}}>{showSlots?"▲":"▼"}</span>
      </div>
      {showSlots&&(
        <div>
          <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap",marginBottom:8}}>
            <span style={{fontSize:8,color:T.dim,letterSpacing:1}}>VISIBLE SLOTS</span>
            {SLOT_COUNT_OPTIONS.map(n=>(
              <button key={n} onClick={()=>setSlotCount(n)} style={BT({
                padding:"2px 6px",fontSize:8,
                borderColor:slotCount===n?T.cyan:T.border,
                color:slotCount===n?T.cyan:T.dim,
                background:slotCount===n?T.panel2:"transparent",
              })}>{n}</button>
            ))}
          </div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
            {Array.from({length:slotCount},(_,i)=>{
              const filled=!!(slots[i]);
              const active=activeSlot===i;
              const queued=queuedSlot===i;
              const name=slotNames[i]||("SLOT "+(i+1));
              return(
                <div key={i} className={queued?"slotBlink":""} style={{
                  display:"flex",flexDirection:"column",alignItems:"center",gap:3,
                  minWidth:70,flex:"1 1 70px",
                  border:"1px solid "+(queued?T.cyan:active?T.gold:filled?T.border+"88":T.border+"44"),
                  borderRadius:3,padding:"5px 6px",
                  background:queued?T.cyan+"12":active?T.gold+"11":filled?T.panel:"transparent",
                }}>
                  <span style={{
                    fontSize:9,fontWeight:700,
                    color:queued?T.cyan:active?T.gold:filled?T.mid:T.dim,
                    maxWidth:"100%",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",
                  }}>{name}</span>
                  <div style={{display:"flex",gap:3,width:"100%"}}>
                    <button onDoubleClick={()=>{
                      const n=window.prompt("Slot name:",slotNames[i]||"");
                      if(n!=null)renameSlot(i,n);
                    }} onClick={()=>saveToSlot(i)} style={BT({
                      flex:1,padding:"3px 0",fontSize:8,
                      borderColor:active?T.gold:T.border,
                      color:active?T.gold:T.dim,
                      background:"transparent",
                    })} title="Click to save · Double-click to rename">W</button>
                    <button onClick={()=>filled&&queueOrLoadSlot(i)} style={BT({
                      flex:1,padding:"3px 0",fontSize:8,
                      borderColor:queued?T.cyan:filled?T.cyan:T.border,
                      color:queued?T.cyan:filled?T.cyan:T.dim,
                      background:"transparent",
                      opacity:filled?1:0.35,
                    })} title={filled?(playing?(queued?"Queued for next reset · click again to cancel":"Queue on next reset"):"Load this slot"):"Empty"}>R</button>
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{fontSize:7,color:T.dim,marginBottom:8,letterSpacing:1}}>W = write now · R = {playing?"queue for next reset":"read now"} · double-click W to rename slot</div>

          <div style={{background:T.panel,border:"1px solid "+T.border,borderRadius:3,padding:"8px 9px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:8}}>
              <div style={{fontSize:9,color:T.dim,letterSpacing:2}}>SLOT SEQUENCER</div>
              <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
                <button onClick={()=>setSlotSeqOn(v=>!v)} style={BT({
                  padding:"4px 9px",fontSize:9,
                  borderColor:slotSeqOn?T.cyan:T.border,
                  color:slotSeqOn?T.cyan:T.dim,
                  background:slotSeqOn?T.panel2:"transparent",
                })}>{slotSeqOn?"◉ RUN":"○ OFF"}</button>
                <div style={{display:"flex",gap:3,alignItems:"center"}}>
                  <span style={{fontSize:8,color:T.dim,letterSpacing:1}}>STEPS</span>
                  {SLOT_SEQ_STEP_OPTIONS.map(n=>(
                    <button key={n} onClick={()=>setSlotSeqLen(n)} style={BT({
                      padding:"2px 6px",fontSize:8,
                      borderColor:slotSeqLen===n?T.cyan:T.border,
                      color:slotSeqLen===n?T.cyan:T.dim,
                      background:slotSeqLen===n?T.panel2:"transparent",
                    })}>{n}</button>
                  ))}
                </div>
                <button onClick={resetSlotSeqRuntime} style={BT({padding:"4px 9px",fontSize:9,borderColor:T.border,color:T.dim})}>RESET POS</button>
                <span style={{fontSize:8,color:T.dim,letterSpacing:1}}>STEP {Math.min(slotSeqPos+1,slotSeqLen)}/{slotSeqLen} · TICK {Math.min(slotSeqHold+1,sanitizeSlotSeqStep(slotSeqSteps[slotSeqPos]).hold)}/{sanitizeSlotSeqStep(slotSeqSteps[slotSeqPos]).hold}</span>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(84px,1fr))",gap:6}}>
              {slotSeqSteps.slice(0,slotSeqLen).map((st,i)=>{
                const active=i===slotSeqPos;
                const filled=st.slot>=0;
                return(
                  <div key={i} style={{
                    border:"1px solid "+(active?T.cyan:filled?T.border+"88":T.border+"33"),
                    borderRadius:3,
                    padding:"6px 6px 5px",
                    background:active?T.cyan+"10":T.panel2,
                  }}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                      <span style={{fontSize:8,color:active?T.cyan:T.dim,letterSpacing:1}}>STEP {i+1}</span>
                      <span style={{fontSize:8,color:filled?T.gold:T.dim}}>{filled?st.slot+1:"--"}</span>
                    </div>
                    <select value={st.slot} onChange={e=>setSlotSeqSteps(prev=>prev.map((row,ri)=>ri===i?{...sanitizeSlotSeqStep(row),slot:clamp(Math.round(+e.target.value),-1,slotCount-1)}:row))} style={{
                      width:"100%",marginBottom:5,fontSize:9,
                      background:T.stepOff,color:filled?T.mid:T.dim,border:"1px solid "+T.border,borderRadius:2,padding:"3px 4px"
                    }}>
                      <option value={-1}>OFF</option>
                      {Array.from({length:slotCount},(_,si)=>(
                        <option key={si} value={si}>{si+1}. {slotNames[si]||("SLOT "+(si+1))}</option>
                      ))}
                    </select>
                    <div style={{display:"flex",alignItems:"center",gap:3,flexWrap:"wrap"}}>
                      <span style={{fontSize:7,color:T.dim,letterSpacing:1}}>BARS</span>
                      {SLOT_SEQ_HOLD_OPTIONS.map(h=>{
                        const on=st.hold===h;
                        return <button key={h} onClick={()=>setSlotSeqSteps(prev=>prev.map((row,ri)=>ri===i?{...sanitizeSlotSeqStep(row),hold:h}:row))} style={BT({padding:"1px 5px",fontSize:7,borderColor:on?T.cyan:T.border,color:on?T.cyan:T.dim,background:on?T.panel2:"transparent"})}>{SLOT_SEQ_HOLD_LABELS[h]||h}</button>;
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{fontSize:8,color:T.dim,marginTop:6,letterSpacing:1}}>Slot sequencer shows only active steps ({slotSeqLen}).</div>
          </div>
        </div>
      )}
    </div>

    {/* ══ LOOP CYCLE SEQ ════════════════════════════════ */}
    <div style={{background:T.panel,border:"1px solid "+(showPlanet?T.gold+(planActive?"":"88"):T.border),borderRadius:4,padding:"10px 14px",marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:showPlanet?10:0}}>
        <div onClick={()=>setShowPlanet(s=>!s)} style={{cursor:"pointer",flex:1,display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:10,color:planActive?T.gold:T.dim,letterSpacing:3}}>LOOP CYCLE SEQ</span>
          <span style={{fontSize:9,color:T.dim}}>shifts root/scale/octave each full loop</span>
          {Array.from({length:planLen},(_,i)=>(
            <div key={i} style={{
              width:7,height:7,borderRadius:1,
              background:i===planCurStep?(planActive&&playing?T.gold:T.gold+"66"):T.border,
              boxShadow:i===planCurStep&&planActive&&playing?"0 0 8px "+T.gold:"none",
            }}/>
          ))}
          <span style={{fontSize:11,color:T.dim,marginLeft:4}}>{showPlanet?"▲":"▼"}</span>
        </div>
        <button onClick={e=>{e.stopPropagation();setPlanActive(v=>!v);}} style={BT({
          padding:"4px 12px",fontSize:10,fontWeight:900,
          borderColor:planActive?T.gold:T.border,
          color:planActive?T.gold:T.dim,
          background:planActive?T.panel2:"transparent",
          marginLeft:8,
        })}>{planActive?"◉ ON":"○ OFF"}</button>
      </div>
      {showPlanet&&(
        <div>
          <div style={{display:"flex",gap:5,alignItems:"center",marginBottom:6,flexWrap:"wrap"}}>
            <span style={{fontSize:9,color:T.dim,letterSpacing:2}}>HOW MANY SLOTS</span>
            {[2,3,4,5,6,7,8].map(n=>(
              <button key={n} onClick={()=>setPlanLen(n)} style={BT({
                padding:"3px 7px",fontSize:11,
                borderColor:planLen===n?T.gold:T.border,
                color:planLen===n?T.gold:T.dim,
                background:planLen===n?T.panel2:"transparent",
              })}>{n}</button>
            ))}
            <span style={{fontSize:7,color:T.dim,marginLeft:6}}>|</span>
            <button onClick={()=>setPlanSync(v=>!v)} title={planSync?"Tick counter resets on every main-seq pattern wrap (keeps alignment)":"Fully free-running, no alignment to main seq"} style={BT({padding:"3px 8px",fontSize:8,fontWeight:700,borderColor:planSync?T.gold:T.border,color:planSync?T.gold:T.dim,background:planSync?T.panel2:"transparent"})}>{planSync?"SYNC":"FREE"}</button>
            <button onClick={()=>{planStepRef.current=0;planTickRef.current=0;cycleCountRef.current=0;setPlanCurStep(0);}} style={BT({padding:"3px 8px",fontSize:8,borderColor:T.border,color:T.dim})}>RESET POS</button>
          </div>
          <div style={{fontSize:8,color:T.dim,marginBottom:8,lineHeight:1.5}}>
            Each slot has its own STEPS setting — how many main-seq steps to hold before advancing.
            SYNC keeps it aligned with the main sequencer's pattern boundaries; FREE runs independently.
            Set root offset, scale, or octave to change the key/sound for that cycle.
            Slot <span style={{color:T.gold}}>{planCurStep+1}</span> is active.
          </div>
          <div style={{overflowX:"auto"}}>
            <div style={{display:"flex",gap:8,minWidth:planLen*160}}>
              {Array.from({length:planLen},(_,i)=>{
                const ps=planSteps[i];
                const isAct=planCurStep===i;
                return(
                  <div key={i} onClick={()=>{planStepRef.current=i;setPlanCurStep(i);}} style={{
                    flex:"1 1 150px",minWidth:150,background:T.stepOff,
                    border:"1px solid "+(isAct?T.gold:T.border),borderRadius:3,padding:"8px 10px",
                    boxShadow:isAct?"0 0 14px "+T.gold+"55":"none",transition:"box-shadow .1s",
                    cursor:"pointer",
                  }}>
                    <div style={{fontSize:9,color:isAct?T.gold:T.dim,letterSpacing:2,marginBottom:7}}>SLOT {i+1}{isAct?" ◉":""}</div>
                    <div style={{display:"flex",alignItems:"center",gap:3,flexWrap:"wrap",marginBottom:8}}>
                      <span style={{fontSize:7,color:T.dim,letterSpacing:1}}>STEPS</span>
                      <button onClick={e=>{e.stopPropagation();setPlanSteps(prev=>prev.map((s2,j)=>j===i?{...s2,hold:clamp((s2.hold||16)-1,1,128)}:s2));}} style={BT({padding:"1px 6px",fontSize:9,borderColor:T.border,color:T.dim})}>-</button>
                      <span style={{fontSize:10,color:T.gold,minWidth:20,textAlign:"center"}}>{ps.hold||16}</span>
