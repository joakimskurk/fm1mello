name: WP-D timing model audit

on:
  push:
    branches: [visual-port-home]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reconstruct WP-D D2 source
        run: bash ci/unpack_source.sh
      - name: Audit timing model source of truth
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('mello/mello_engine.h'), Path('mello/mello_engine.c'),
              Path('mello/mello_transport.h'), Path('mello/mello_transport.c'),
              Path('mello/mello_ui.h'), Path('mello/mello_ui.c'),
              Path('mello/mello_storage.h'), Path('mello/mello_storage.c'),
          ]
          needles = (
              'seq_len', 'sequence', 'reset', 'sync', 'free', 'bar', 'clock',
              'tick', 'loop_cycle', 'slot_seq', 'chain', 'hold', 'bpm',
              'project_defaults', 'storage', 'serialize', 'deserialize',
          )
          for path in files:
              if not path.exists():
                  print(f'--- missing {path} ---')
                  continue
              lines = path.read_text().splitlines()
              hits = []
              for i, line in enumerate(lines):
                  low = line.lower()
                  if any(n in low for n in needles):
                      hits.append((max(0, i - 5), min(len(lines), i + 8)))
              merged=[]
              for a,b in hits:
                  if merged and a <= merged[-1][1] + 1:
                      merged[-1] = (merged[-1][0], max(merged[-1][1], b))
                  else:
                      merged.append((a,b))
              print(f'=== {path} hits={len(hits)} windows={len(merged)} ===')
              for n,(a,b) in enumerate(merged,1):
                  print(f'--- {path}:{a+1}-{b} window {n} ---')
                  for j in range(a,b):
                      print(f'{j+1:5d}: {lines[j]}')
          PY
      - name: Verify permanent D2 musical timing contract
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I mello tools/wp_d_timing_model.c mello/mello_engine.c mello/mello_transport.c -o /tmp/wp_d_timing_model
          /tmp/wp_d_timing_model
      - name: Verify D2 timing-domain separation and pre-D3 UI boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          engine = Path('mello/mello_engine.c').read_text()
          header = Path('mello/mello_engine.h').read_text()
          ui = Path('mello/mello_ui.c').read_text()
          checks = {
              '2 BAR default': ('engine', 'p->master_len=32u; /* WP-D: default 2 BAR = 32 sixteenth notes. */'),
              'BAR scales by DIV': ('engine', '(uint32_t)e->project.master_len/(uint32_t)e->project.clock_div'),
              'FREE semantic': ('header', '0=FREE. Non-zero is musical length in 1/16-note units'),
              'main choices remain canonical': ('ui', 'static const uint16_t master_lengths[] = {0u,16u,32u,64u,128u,256u};'),
              'main pre-D3 label': ('ui', 'l[1]="RESET";value_u(v[1],"",e->project.master_len);'),
              'Loop Cycle sync/free': ('ui', 'l[1]="SYNC";copy_s(v[1],e->loop_cycle.sync?"SYNC":"FREE");'),
              'external transport sync': ('ui', 'l[2]="SYNC";copy_s(v[2],sync_name(ui->transport->sync_mode));'),
              'slot hold': ('ui', 'l[1]="HOLD";value_u(v[1],"",ss->hold);'),
          }
          sources = {'engine': engine, 'header': header, 'ui': ui}
          for name, (source, needle) in checks.items():
              if needle not in sources[source]:
                  raise SystemExit(f'D2 timing-model drift: {name}: {needle}')
              print(f'PASS {name}')
          PY
      - name: Keep current timing/event-order regressions green
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I mello tools/audio_timing_stress.c mello/*.c -o /tmp/audio_timing_stress
          /tmp/audio_timing_stress
          cc -std=c11 -Wall -Wextra -Werror -I mello tools/audio_event_order_smoke.c mello/*.c -o /tmp/audio_event_order_smoke
          /tmp/audio_event_order_smoke
      - name: Record timing-source hashes
        run: sha256sum mello/mello_engine.h mello/mello_engine.c mello/mello_transport.h mello/mello_transport.c mello/mello_ui.h mello/mello_ui.c
      - name: Publish reconstructed timing source for D2 audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp-d-d2-reconstructed-timing-source
          path: |
            mello/mello_engine.h
            mello/mello_engine.c
            mello/mello_transport.h
            mello/mello_transport.c
            mello/mello_ui.h
            mello/mello_ui.c
            mello/mello_storage.h
            mello/mello_storage.c
          if-no-files-found: warn
          retention-days: 7
