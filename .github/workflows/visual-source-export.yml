name: Visual source export
on:
  push:
    branches: [visual-port-home]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct patched source
        run: bash ci/unpack_source.sh
      - name: Pack patched source
        run: tar -czf visual-port-source.tar.gz mello overlay tools
      - uses: actions/upload-artifact@v4
        with:
          name: visual-port-source
          path: visual-port-source.tar.gz
          if-no-files-found: error
