name: Visual port target build
on:
  push:
    branches: [visual-port-home]
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: bash ci/build_target.sh
      packages: build/skurkymello-*.fwsc
      sdk: true
