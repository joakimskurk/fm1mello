name: Source inspect
on:
  push:
    branches: [chord-sync-pass]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reconstruct source
        run: bash ci/unpack_source.sh
      - name: Pack exact reconstructed source
        run: tar -czf reconstructed-source.tgz mello overlay tools ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reconstructed-source
          path: reconstructed-source.tgz
