name: WP-B live-edit source probe

on:
  push:
    branches: [visual-port-home]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reconstruct final Mello source
        run: bash ci/unpack_source.sh
      - name: Inspect live-edit paths
        run: python3 ci/wp_b_live_edit_probe.py
      - name: Export reconstructed source for WP-B diagnosis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp-b-reconstructed-source
          path: |
            mello/
            overlay/
          if-no-files-found: error
