name: WP-B live-edit source probe

on:
  push:
    branches: [tmp-wp-b-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reconstruct final Mello source
        run: bash ci/unpack_source.sh
      - name: Inspect live-edit paths
        run: python3 ci/wp_b_live_edit_probe.py
